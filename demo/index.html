<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="robots" content="noindex,nofollow">
<title>Demo de asistente virtual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--p:#1f2937;--s:#2563eb;--bg:#f6f5f2;--card:#fff;--ink:#16161a;--mute:#62626b;--line:#e6e4df;--k-navy:#14112B;--k-coral:#FF5A36;--k-cream:#FFF4E6}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 'Plus Jakarta Sans',system-ui,sans-serif;min-height:100vh}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{color:inherit}
.hide{display:none!important}

/* franja kionda */
.kband{background:var(--k-navy);color:var(--k-cream);font:500 13px/1.35 'Space Grotesk',sans-serif;padding:9px 16px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center;position:sticky;top:0;z-index:30}
.kband b{color:var(--k-coral);font-weight:700}
.kband .pill{border:1px solid rgba(255,244,230,.35);border-radius:99px;padding:2px 9px;font-size:11px;letter-spacing:.06em;text-transform:uppercase}

/* fondo: captura de la web de la inmobiliaria */
.shot{position:relative;width:100%;max-width:1366px;margin:0 auto;user-select:none;-webkit-user-select:none}
.shot img{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none}
.shot .fade{position:absolute;left:0;right:0;bottom:0;height:160px;background:linear-gradient(to bottom,rgba(246,245,242,0),var(--bg));pointer-events:none}
.shot .guard{position:absolute;inset:0}
.after{text-align:center;color:var(--mute);font-size:14px;padding:6px 16px 130px}
/* sin captura */
.plain{min-height:calc(100vh - 40px);display:grid;place-items:center;padding:24px 16px 140px}
.plain .box{max-width:440px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:20px;padding:30px 22px}
.plain .mark{display:flex;justify-content:center;margin-bottom:14px}
.plain .mark img{height:64px;width:auto;max-width:200px;object-fit:contain}
.plain .mark .mono{width:64px;height:64px;font-size:24px;color:#fff;border-radius:16px}
.plain h1{font-size:22px;line-height:1.2;margin-bottom:8px}
.plain p{color:var(--mute)}
.mono{width:44px;height:44px;border-radius:12px;background:var(--s);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}

/* globo + chat */
.launch{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:10px}
.tip{background:#fff;border:2px solid var(--s);box-shadow:0 12px 30px -10px rgba(0,0,0,.4);padding:10px 14px;border-radius:14px;font-size:15px;font-weight:600;max-width:220px;cursor:pointer;line-height:1.3}
.bubble{animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--s) 55%,transparent),0 14px 30px -10px rgba(0,0,0,.45)}70%{box-shadow:0 0 0 16px transparent,0 14px 30px -10px rgba(0,0,0,.45)}100%{box-shadow:0 0 0 0 transparent,0 14px 30px -10px rgba(0,0,0,.45)}}
.bubble{width:62px;height:62px;border-radius:50%;background:var(--s);color:#fff;display:grid;place-items:center;box-shadow:0 14px 30px -10px rgba(0,0,0,.45);position:relative}
.bubble svg{width:28px;height:28px}
.bubble .dot{position:absolute;top:4px;right:4px;width:14px;height:14px;border-radius:50%;background:#22c55e;border:2px solid #fff}
.veil{position:fixed;inset:0;z-index:45;background:rgba(10,8,12,.55)}
.chat{position:fixed;z-index:50;left:50%;top:50%;transform:translate(-50%,-50%);width:440px;max-width:calc(100vw - 32px);height:min(720px,calc(100vh - 32px));background:#fff;border-radius:20px;box-shadow:0 30px 70px -20px rgba(0,0,0,.45);display:flex;flex-direction:column;overflow:hidden}
@media (max-width:560px){.chat{left:0;top:0;transform:translateY(var(--vvt,0px));width:100%;max-width:none;height:var(--vvh,100dvh);border-radius:0}}
html.lock,html.lock body{overflow:hidden;overscroll-behavior:none}
.msgs{min-height:0;overscroll-behavior:contain}
.msgs>*{flex-shrink:0}
.sbar{display:flex;align-items:center;gap:8px;background:#eef6ff;color:#1e3a5f;font-size:12.5px;padding:6px 10px 6px 14px;border-bottom:1px solid #d6e6f7}
.sbar span{flex:1}
.sbar button{border:1px solid #9cb9d9;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600;background:#fff}
.acts{display:flex;flex-direction:column;gap:6px;align-self:flex-start;max-width:85%}
.acts button{text-align:left;border:1px solid var(--s);color:var(--s);background:#fff;border-radius:14px;padding:8px 12px;font-size:14px;font-weight:500;line-height:1.3}
.acts button.pri{background:var(--s);color:#fff;font-weight:600;text-align:center}
.simgo{padding:8px 12px 0;background:#fff}
.simgo button{width:100%;background:var(--s);color:#fff;border-radius:12px;padding:11px;font-weight:600;font-size:15px}
.pcard{align-self:flex-start;width:min(280px,85%);background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pcard img{display:block;width:100%;height:150px;object-fit:cover;background:#eee}
.pcard .pc{padding:10px 12px 12px;display:grid;gap:3px}
.pcard b{font-size:14.5px;line-height:1.3}
.pcard small{color:var(--mute);font-size:13px}
.pcard .pr{font-weight:700;color:var(--ink);font-size:15px}
.pcard a{color:var(--s);font-weight:600;font-size:13.5px;text-decoration:none;margin-top:2px}
.kclose{align-self:stretch;background:#fff;border:1.5px solid var(--s);border-radius:16px;padding:14px;display:grid;gap:8px;font-size:15px;line-height:1.4}
.kclose .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.kclose .row a,.kclose .row button{flex:1 1 auto;text-align:center;border-radius:99px;padding:9px 12px;font-size:14px;font-weight:600;text-decoration:none;border:1px solid var(--s);color:var(--s);background:#fff}
.kclose .row .wa{background:#25D366;border-color:#25D366;color:#fff}
.ch .pbtn{width:auto;height:32px;padding:0 11px;border:1px solid rgba(255,255,255,.45);border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap}
.ch .mono{color:#fff}
.ch{background:var(--p);color:#fff;padding:14px 14px;display:flex;align-items:center;gap:10px}
.ch .mono{width:38px;height:38px;font-size:15px;border-radius:10px}
.ch img{height:38px;width:38px;object-fit:contain;background:#fff;border-radius:10px;padding:3px}
.ch-t{min-width:0;flex:1}
.ch-t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-t small{font-size:12px;opacity:.8}
.ch button{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px}
.ch button:hover{background:rgba(255,255,255,.12)}
.cdemo{background:#fff8e6;color:#7a5b00;font-size:12px;padding:6px 14px;text-align:center;border-bottom:1px solid #f1e3b5}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:#fafaf8}
.m{max-width:85%;padding:10px 13px;border-radius:16px;font-size:15px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
.m.b{background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px;align-self:flex-start}
.m.u{background:var(--s);color:#fff;border-bottom-right-radius:5px;align-self:flex-end}
.m.sys{align-self:center;background:none;color:var(--mute);font-size:13px;text-align:center}
.typing{display:inline-flex;gap:4px}.typing i{width:7px;height:7px;border-radius:50%;background:#b5b5bd;animation:bl 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,80%,100%{opacity:.3}40%{opacity:1}}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 10px;background:#fafaf8}
.chips button{border:1px solid var(--s);color:var(--s);background:#fff;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:500}
form.in{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
form.in textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:14px;padding:10px 12px;font:inherit;font-size:16px;max-height:110px;outline:none}
form.in textarea:focus{border-color:var(--s)}
form.in button{width:44px;height:44px;border-radius:50%;background:var(--s);color:#fff;display:grid;place-items:center;align-self:flex-end}
form.in button:disabled{opacity:.45}
.note{font-size:11px;color:var(--mute);text-align:center;padding:0 12px 8px}

/* panel */
.panel{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto}
.ptop{position:sticky;top:0;background:var(--p);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;z-index:2}
.ptop b{font-size:17px;flex:1}
.ptop button{border:1px solid rgba(255,255,255,.4);border-radius:99px;padding:7px 13px;font-size:14px;font-weight:600}
.pin{max-width:760px;margin:0 auto;padding:16px 16px 60px}
.pintro{color:var(--mute);font-size:14px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}
.stat small{font-size:12px;color:var(--mute)}
.lead{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.lh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em}
.caliente{background:#fee2e2;color:#b91c1c}.tibio{background:#fef3c7;color:#92400e}.frio{background:#e0f2fe;color:#075985}
.lh time{font-size:13px;color:var(--mute);margin-left:auto}
.lead p{font-size:15px}
.kv{font-size:14px;color:var(--mute);margin-top:6px}
.kv b{color:var(--ink);font-weight:600}
details{margin-top:10px}
summary{cursor:pointer;color:var(--s);font-size:14px;font-weight:600}
.conv{margin-top:8px;display:flex;flex-direction:column;gap:6px;background:#fafaf8;border-radius:12px;padding:10px}
.conv .m{font-size:14px}

/* estados */
.state{min-height:calc(100vh - 40px);display:grid;place-items:center;padding:24px 16px}
.state .box{max-width:440px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:20px;padding:30px 22px}
.state h1{font-size:24px;margin-bottom:10px}
.state p{color:var(--mute);margin-bottom:18px}
.kbtn{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:99px;font-weight:600;text-decoration:none;margin-top:8px}
.kbtn.wa{background:#25D366;color:#fff}.kbtn.ml{border:1.5px solid var(--k-navy);color:var(--k-navy)}
.loading{min-height:70vh;display:grid;place-items:center;color:var(--mute)}
</style>
</head>
<body>
<div class="kband" id="kband"></div>
<div id="app"><div class="loading">Cargando demo…</div></div>

<script>
(() => {
  const SB = "https://pekqdgyxrqqjhmxtjovp.supabase.co";
  const KEY = "sb_publishable_f-knrak9HDgsY49k-0oYvg_gIqIYQbS";
  const BOT = SB + "/functions/v1/demo-bot";
  const NEUTRA = "inmobiliaria-demo";
  const WA = "https://wa.me/5491132654042";
  const MAIL = "hola@kiondaia.com";

  const qs = new URLSearchParams(location.search);
  const slug = (qs.get("i") || NEUTRA).trim().toLowerCase();
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };
  const app = $("#app"), band = $("#kband");

  const ICON_CHAT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>';
  const ICON_HOUSE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>';
  const ICON_SEND = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

  async function rpc(fn, args) {
    const r = await fetch(`${SB}/rest/v1/rpc/${fn}`, {
      method: "POST",
      headers: { apikey: KEY, "content-type": "application/json" },
      body: JSON.stringify(args),
    });
    if (!r.ok) throw new Error(fn + " " + r.status);
    return r.json();
  }

  const fmtDate = (d) => {
    const [y, m, day] = String(d).split("-");
    return `${day}/${m}/${y}`;
  };
  const initials = (n) => n.replace(/\(.*?\)/g, "").split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join("").toUpperCase();
  const safeColor = (c, def) => (/^#[0-9a-f]{6}$/i.test(c || "") ? c : def);
  const safeUrl = (u) => (/^https:\/\//i.test(u || "") ? u : "");

  function contactBlock() {
    return `<a class="kbtn wa" href="${WA}" target="_blank" rel="noopener">WhatsApp +54 9 11 3265-4042</a>
            <a class="kbtn ml" href="mailto:${MAIL}">${MAIL}</a>`;
  }

  function showState(title, text) {
    band.innerHTML = `<span class="pill">Demo</span><span>Asistente virtual por <b>kionda IA</b></span>`;
    app.innerHTML = `<div class="state"><div class="box"><h1>${esc(title)}</h1><p>${esc(text)}</p>${contactBlock()}</div></div>`;
  }

  // ---------- arranque ----------
  rpc("get_demo", { p_slug: slug }).then((res) => {
    if (res.estado === "activa") return render(res.demo);
    if (res.estado === "finalizada")
      return showState("Esta demo ya finalizó", `La demo del asistente virtual para ${res.nombre} ya no está disponible. Si querés verla de nuevo o tener el asistente en tu web, escribinos.`);
    return showState("Demo no encontrada", "El link no corresponde a ninguna demo activa. Si te lo pasaron, escribinos y te mandamos uno nuevo.");
  }).catch(() => showState("No pudimos cargar la demo", "Revisá tu conexión e intentá de nuevo en un rato."));

  function render(d) {
    const neutra = d.tipo === "neutra";
    document.documentElement.style.setProperty("--p", safeColor(d.color_principal, "#1f2937"));
    document.documentElement.style.setProperty("--s", safeColor(d.color_secundario, "#2563eb"));
    document.title = `${d.nombre} · Demo de asistente virtual`;
    const logo = safeUrl(d.logo_url);
    const mark = logo ? `<img src="${esc(logo)}" alt="${esc(d.nombre)}" onerror="this.outerHTML='<div class=mono>${esc(initials(d.nombre))}</div>'">` : `<div class="mono">${esc(initials(d.nombre))}</div>`;
    const props = Array.isArray(d.propiedades) ? d.propiedades : [];

    band.innerHTML = neutra
      ? `<span class="pill">Demo</span><span>Inmobiliaria ficticia · Asistente virtual por <b>kionda IA</b></span>`
      : `<span class="pill">Demo</span><span>Preparada por <b>kionda IA</b> para ${esc(d.nombre)} · disponible hasta el ${fmtDate(d.vence)}</span>`;

    const celu = safeUrl(d.captura_celu), compu = safeUrl(d.captura_compu);
    const tactil = window.matchMedia("(hover: none)").matches;
    const fondo = (celu || compu)
      ? `<div class="shot" aria-label="Así se ve la web de ${esc(d.nombre)}">
           <picture>
             ${celu ? `<source media="(max-width: 700px)" srcset="${esc(celu)}">` : ""}
             <img id="shotImg" src="${esc(compu || celu)}" alt="" draggable="false">
           </picture>
           <div class="guard"></div><div class="fade"></div>
         </div>
         <div class="after">Captura de la web de ${esc(d.nombre)} · el asistente está abajo a la derecha</div>`
      : plainBox(d, mark, neutra);

    app.innerHTML = `
      <div id="bg">${fondo}</div>

      <div class="launch" id="launch">
        <div class="tip" id="tip">${tactil ? "Tocá acá" : "Hacé clic acá"} para probar el asistente 👉</div>
        <button class="bubble" id="bubble" aria-label="Abrir el asistente">${ICON_CHAT}<span class="dot"></span></button>
      </div>

      <div class="veil hide" id="veil"></div>
      <section class="chat hide" id="chat" aria-label="Asistente virtual">
        <div class="ch">${mark}<div class="ch-t"><b>Asistente virtual</b><small>${esc(d.nombre)}</small></div>
          <button class="pbtn" id="openPanel">Ver panel</button>
          <button id="reset" title="Empezar de nuevo" aria-label="Empezar de nuevo">↻</button>
          <button id="close" title="Cerrar" aria-label="Cerrar">✕</button></div>
        <div class="cdemo" id="cdemo">Versión demo · asistente con IA</div>
        <div class="sbar hide" id="sbar"><span>Simulación · escribí como si fueras un cliente</span><button type="button" id="endSim">Terminar</button></div>
        <div class="msgs" id="msgs"></div>
        <div class="simgo hide" id="simgo"><button type="button" id="startSim">▶ Empezar simulación</button></div>
        <form class="in" id="form"><textarea id="txt" rows="1" placeholder="Escribí tu consulta…" maxlength="1200"></textarea><button id="send" aria-label="Enviar">${ICON_SEND}</button></form>
        <div class="note">Asistente con IA. Puede cometer errores.</div>
      </section>

      <section class="panel hide" id="panel"></section>`;

    // si la captura no carga, se muestra el fondo simple
    const img = $("#shotImg");
    if (img) img.onerror = () => { $("#bg").innerHTML = plainBox(d, mark, neutra); };

    setupChat(d, props);
    setupPanel(d);
  }

  function plainBox(d, mark, neutra) {
    return `<div class="plain"><div class="box">
        <div class="mark">${mark}</div>
        <h1>${neutra ? "Asistente virtual de " + esc(d.nombre) : "Asistente virtual para " + esc(d.nombre)}</h1>
        <p>Así atendería las consultas de ${neutra ? "una inmobiliaria" : "su web"}: responde a cualquier hora, pregunta qué busca cada persona y deja los interesados ordenados en un panel. Probalo con el botón de abajo.</p>
      </div></div>`;
  }

  // ---------- chat ----------
  const LUCAS_WA = "5491162604647";
  function saludoHora() {
    const h = new Date().getHours();
    return h >= 5 && h < 13 ? "Buen día" : h >= 13 && h < 20 ? "Buenas tardes" : "Buenas noches";
  }
  function introPresentacion(d, n) {
    const neutra = d.tipo === "neutra";
    return neutra
      ? `${saludoHora()} 👋 Soy una demo del asistente virtual que podría tener una inmobiliaria.\nPara esta prueba usamos ${n} propiedades de una inmobiliaria ficticia; la versión real incluye todas las que publiquen.\n¿Les gustaría hacerme alguna pregunta antes de empezar la simulación? Desde ya, gracias por su atención.`
      : `${saludoHora()} 👋 Soy una demo del asistente virtual que podría tener ${d.nombre}.\nPara esta prueba cargamos ${n} propiedades de su web; la versión real incluye todas las que publiquen.\n¿Les gustaría hacerme alguna pregunta antes de empezar la simulación? Desde ya, gracias por su atención.`;
  }
  function textoCierre() {
    return "¡Así funcionaría con sus clientes! 🙌 La charla quedó resumida y calificada en el panel.\nEl asistente cuesta USD 300 por única vez + USD 20 por mes de mantenimiento.\nSi les interesa, coordinamos una videollamada de 20 minutos. ¡Gracias por probarlo!";
  }

  function setupChat(d, props) {
    const K = "demo2:" + d.slug;
    const root = document.documentElement;
    const chat = $("#chat"), msgs = $("#msgs"), txt = $("#txt"), form = $("#form"), send = $("#send"),
      launch = $("#launch"), veil = $("#veil"), sbar = $("#sbar"), simgo = $("#simgo"), cdemo = $("#cdemo");
    const tactil = window.matchMedia("(hover: none)").matches;
    const nuevo = () => ({ id: null, log: [], done: false });
    let modo = store.get(K + ":modo") === "simulacion" ? "simulacion" : "presentacion";
    const st = { presentacion: nuevo(), simulacion: nuevo() };
    for (const m of ["presentacion", "simulacion"]) {
      try { Object.assign(st[m], JSON.parse(store.get(K + ":" + m) || "{}")); } catch {}
    }
    const save = () => { store.set(K + ":modo", modo); store.set(K + ":" + modo, JSON.stringify(st[modo])); };
    const S = () => st[modo];
    const podes = d.trato === "usted" ? "puede" : d.trato === "tu" ? "puedes" : "podés";
    let busy = false;

    // --- que el chat siga al teclado (tipo WhatsApp) ---
    let pegado = true;
    msgs.addEventListener("scroll", () => { pegado = msgs.scrollHeight - msgs.scrollTop - msgs.clientHeight < 80; });
    const abajo = () => { msgs.scrollTop = msgs.scrollHeight; };
    const vv = window.visualViewport;
    function fit() {
      if (vv) {
        root.style.setProperty("--vvh", vv.height + "px");
        root.style.setProperty("--vvt", vv.offsetTop + "px");
      }
      if (pegado) requestAnimationFrame(abajo);
    }
    if (vv) { vv.addEventListener("resize", fit); vv.addEventListener("scroll", fit); }
    window.addEventListener("resize", fit);

    // --- piezas de la conversacion ---
    function add(role, text) {
      const el = document.createElement("div");
      el.className = "m " + role;
      el.textContent = text;
      msgs.appendChild(el);
      return el;
    }
    function botones(lista) {
      const box = document.createElement("div");
      box.className = "acts";
      lista.forEach(([label, fn, pri]) => {
        const b = document.createElement("button");
        b.type = "button"; b.textContent = label; if (pri) b.className = "pri";
        b.addEventListener("pointerdown", (e) => e.preventDefault());
        b.onclick = fn;
        box.appendChild(b);
      });
      msgs.appendChild(box);
      return box;
    }
    function tarjeta(i) {
      const p = props[i - 1];
      if (!p) return;
      const foto = safeUrl(p.foto), link = safeUrl(p.link);
      const meta = [p.operacion, p.barrio, p.ambientes ? p.ambientes + " amb." : ""].filter(Boolean).map(esc).join(" · ");
      const el = document.createElement("div");
      el.className = "pcard";
      el.innerHTML = `${foto ? `<img src="${esc(foto)}" alt="" loading="lazy" onerror="this.remove()">` : ""}
        <div class="pc"><b>${esc(p.titulo || "Propiedad")}</b>${meta ? `<small>${meta}</small>` : ""}
        <span class="pr">${esc(p.precio || "Precio a consultar")}</span>
        ${link ? `<a href="${esc(link)}" target="_blank" rel="noopener">Ver aviso en su web ↗</a>` : ""}</div>`;
      const img = el.querySelector("img");
      if (img) img.addEventListener("load", () => { if (pegado) abajo(); });
      msgs.appendChild(el);
    }
    function cierre() {
      const el = document.createElement("div");
      el.className = "kclose";
      const wa = `https://wa.me/${LUCAS_WA}?text=${encodeURIComponent(`Hola Lucas, vi la demo del asistente virtual para ${d.nombre}.`)}`;
      el.innerHTML = `<div style="white-space:pre-wrap">${esc(textoCierre())}</div>
        <div class="row"><a class="wa" href="${wa}" target="_blank" rel="noopener">Coordinar videollamada</a>
        <button type="button" data-a="panel">Ver panel</button><button type="button" data-a="otra">Simular de nuevo</button></div>`;
      el.querySelector('[data-a="panel"]').onclick = () => $("#openPanel").click();
      el.querySelector('[data-a="otra"]').onclick = () => { st.simulacion = nuevo(); save(); draw(); };
      msgs.appendChild(el);
    }

    function draw() {
      msgs.innerHTML = "";
      const s = S();
      const sim = modo === "simulacion";
      sbar.classList.toggle("hide", !sim || s.done);
      cdemo.classList.toggle("hide", sim && !s.done);
      simgo.classList.toggle("hide", sim || s.log.length === 0);
      if (!sim) {
        add("b", introPresentacion(d, props.length));
        if (!s.log.length) botones([
          ["▶ Empezar simulación", empezarSim, true],
          ["¿Qué incluye el servicio?", () => ask("¿Qué incluye el servicio?")],
          ["¿Cómo se instala en la web?", () => ask("¿Cómo se instala en la web?")],
        ]);
      } else {
        add("b", d.saludo || `Hola, soy el asistente de ${d.nombre}. ¿Buscás comprar, alquilar o tasar?`);
        if (props.length) {
          add("b", `También ${podes} consultarme por alguna de estas propiedades:`);
          if (!s.log.length) botones(props.map((p) => [
            `${p.titulo || "Propiedad"}${p.precio ? " · " + p.precio : ""}`,
            () => ask(`Me interesa: ${p.titulo}${p.barrio ? " (" + p.barrio + ")" : ""}`),
          ]));
        }
      }
      s.log.forEach((m) => {
        if (m.r === "fin") return cierre();
        add(m.r, m.t);
        (m.m || []).forEach(tarjeta);
      });
      txt.disabled = send.disabled = s.done;
      txt.placeholder = sim ? "Escribí como si fueras un cliente…" : "Escribí tu pregunta…";
      pegado = true; requestAnimationFrame(abajo);
    }

    function empezarSim() {
      modo = "simulacion";
      if (S().done) st.simulacion = nuevo();
      save(); draw();
    }
    function terminarSim() {
      const s = st.simulacion;
      if (s.done) return;
      s.done = true; s.log.push({ r: "fin" }); save(); draw();
    }

    function open() {
      chat.classList.remove("hide"); veil.classList.remove("hide"); launch.classList.add("hide");
      root.classList.add("lock");
      fit(); draw();
      if (!tactil) setTimeout(() => txt.focus(), 50);
    }
    function close() {
      chat.classList.add("hide"); veil.classList.add("hide"); launch.classList.remove("hide");
      root.classList.remove("lock"); txt.blur();
    }

    async function ask(text) {
      text = text.trim();
      const s = S(), m0 = modo;
      if (!text || busy || s.done) return;
      busy = true; send.disabled = true;
      msgs.querySelectorAll(".acts").forEach((x) => x.remove());
      s.log.push({ r: "u", t: text }); add("u", text); save();
      simgo.classList.toggle("hide", m0 === "simulacion");
      txt.value = ""; txt.style.height = "";
      const t = add("b", ""); t.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
      pegado = true; abajo();
      try {
        const r = await fetch(BOT, {
          method: "POST",
          headers: { "content-type": "application/json", apikey: KEY },
          body: JSON.stringify({ slug: d.slug, message: text, id: s.id, modo: m0 }),
        });
        const j = await r.json();
        if (j.id) s.id = j.id;
        const reply = j.reply || "Tuve un problema para responder. ¿Probás de nuevo?";
        t.textContent = reply;
        const most = Array.isArray(j.mostrar) ? j.mostrar : [];
        s.log.push({ r: "b", t: reply, m: most });
        most.forEach(tarjeta);
        if (j.finalizada) setTimeout(() => location.reload(), 2500);
        else if (j.done) {
          if (m0 === "simulacion") { s.done = true; s.log.push({ r: "fin" }); save(); busy = false; return draw(); }
          s.done = true; add("sys", "Charla finalizada · tocá ↻ para empezar otra");
        }
      } catch {
        t.textContent = "No pude conectarme. Revisá tu conexión e intentá de nuevo.";
        s.log.pop();
      }
      save();
      busy = false; send.disabled = s.done; txt.disabled = s.done;
      if (pegado) abajo();
    }

    $("#bubble").onclick = open;
    $("#tip").onclick = open;
    veil.onclick = close;
    $("#close").onclick = close;
    $("#startSim").onclick = empezarSim;
    $("#endSim").onclick = terminarSim;
    $("#reset").onclick = () => {
      if (modo === "simulacion") { modo = "presentacion"; st.presentacion = nuevo(); st.simulacion = nuevo(); store.set(K + ":simulacion", "{}"); }
      else st.presentacion = nuevo();
      save(); draw();
    };
    // el teclado no se cierra al tocar enviar
    send.addEventListener("pointerdown", (e) => e.preventDefault());
    form.onsubmit = (e) => { e.preventDefault(); ask(txt.value); };
    txt.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !tactil) { e.preventDefault(); ask(txt.value); } });
    txt.addEventListener("input", () => { txt.style.height = "auto"; txt.style.height = Math.min(txt.scrollHeight, 110) + "px"; });
    txt.addEventListener("focus", () => { pegado = true; setTimeout(fit, 250); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
  }

  // ---------- panel ----------
  function setupPanel(d) {
    const panel = $("#panel");
    const neutra = d.tipo === "neutra";
    const lbl = { caliente: "Caliente", tibio: "Tibio", frio: "Frío" };
    const when = (s) => new Date(s).toLocaleString("es-AR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });

    async function load() {
      panel.innerHTML = `<div class="ptop"><b>Panel de consultas</b><button id="pRef">Actualizar</button><button id="pClose">Volver</button></div><div class="pin"><div class="loading" style="min-height:40vh">Cargando…</div></div>`;
      $("#pClose").onclick = () => panel.classList.add("hide");
      $("#pRef").onclick = load;
      let rows = [];
      try { rows = await rpc("get_demo_panel", { p_slug: d.slug }); } catch { $(".pin", panel).innerHTML = `<div class="empty">No pudimos cargar el panel. Probá de nuevo.</div>`; return; }
      const c = { caliente: 0, tibio: 0, frio: 0 };
      rows.forEach((r) => { c[r.calificacion] = (c[r.calificacion] || 0) + 1; });
      $(".pin", panel).innerHTML = `
        <p class="pintro">${neutra
          ? "Así le llegan las consultas a la inmobiliaria: cada charla con su resumen y una calificación. En esta demo pública los contactos se muestran ocultos."
          : `Acá ves cada charla que tuvo el asistente de ${esc(d.nombre)}: un resumen, qué busca la persona, sus datos y qué tan lista está para avanzar. Probalo: escribile al asistente y tocá "Actualizar".`}</p>
        <div class="stats">
          <div class="stat"><b>${rows.length}</b><small>Charlas</small></div>
          <div class="stat"><b>${c.caliente}</b><small>Calientes</small></div>
          <div class="stat"><b>${c.tibio}</b><small>Tibios</small></div>
          <div class="stat"><b>${c.frio}</b><small>Fríos</small></div>
        </div>
        ${rows.length ? rows.map((r) => `
          <article class="lead">
            <div class="lh"><span class="badge ${esc(r.calificacion)}">${lbl[r.calificacion] || esc(r.calificacion)}</span><b>${esc(r.nombre || "Sin nombre")}</b><time>${when(r.fecha)}</time></div>
            <p>${esc(r.resumen || "Charla en curso.")}</p>
            ${r.busca ? `<div class="kv"><b>Busca:</b> ${esc(r.busca)}</div>` : ""}
            ${r.contacto ? `<div class="kv"><b>Contacto:</b> ${esc(r.contacto)}</div>` : ""}
            <details><summary>Ver charla completa (${(r.mensajes || []).length} mensajes)</summary>
              <div class="conv">${(r.mensajes || []).map((m) => `<div class="m ${m.role === "user" ? "u" : "b"}">${esc(m.text)}</div>`).join("")}</div>
            </details>
          </article>`).join("") : `<div class="empty">Todavía no hay charlas. Abrí el asistente, hacé una consulta y volvé acá.</div>`}`;
    }
    $("#openPanel").onclick = () => { panel.classList.remove("hide"); load(); };
  }
})();
</script>
</body>
</html>
