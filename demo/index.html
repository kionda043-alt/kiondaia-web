<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="robots" content="noindex,nofollow">
<title>Demo de asistente virtual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--p:#1f2937;--s:#2563eb;--bg:#f6f5f2;--card:#fff;--ink:#16161a;--mute:#62626b;--line:#e6e4df;--k-navy:#14112B;--k-coral:#FF5A36;--k-cream:#FFF4E6}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 'Plus Jakarta Sans',system-ui,sans-serif;min-height:100vh}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{color:inherit}
.hide{display:none!important}

/* franja kionda */
.kband{background:var(--k-navy);color:var(--k-cream);font:500 13px/1.35 'Space Grotesk',sans-serif;padding:9px 16px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center;position:sticky;top:0;z-index:30}
.kband b{color:var(--k-coral);font-weight:700}
.kband .pill{border:1px solid rgba(255,244,230,.35);border-radius:99px;padding:2px 9px;font-size:11px;letter-spacing:.06em;text-transform:uppercase}

/* fondo: captura de la web de la inmobiliaria */
.shot{position:relative;width:100%;max-width:1366px;margin:0 auto;user-select:none;-webkit-user-select:none}
.shot img{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none}
.shot .fade{position:absolute;left:0;right:0;bottom:0;height:160px;background:linear-gradient(to bottom,rgba(246,245,242,0),var(--bg));pointer-events:none}
.shot .guard{position:absolute;inset:0}
.after{text-align:center;color:var(--mute);font-size:14px;padding:6px 16px 130px}
/* sin captura */
.plain{min-height:calc(100vh - 40px);display:grid;place-items:center;padding:24px 16px 140px}
.plain .box{max-width:440px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:20px;padding:30px 22px}
.plain .mark{display:flex;justify-content:center;margin-bottom:14px}
.plain .mark img{height:64px;width:auto;max-width:200px;object-fit:contain}
.plain .mark .mono{width:64px;height:64px;font-size:24px;color:#fff;border-radius:16px}
.plain h1{font-size:22px;line-height:1.2;margin-bottom:8px}
.plain p{color:var(--mute)}
.mono{width:44px;height:44px;border-radius:12px;background:var(--s);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}

/* globo + chat */
.dim{position:fixed;inset:0;z-index:35;background:rgba(12,10,16,.48);pointer-events:none}
.launch{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:10px}
.tip{background:#fff;border:2px solid var(--s);box-shadow:0 12px 30px -10px rgba(0,0,0,.4);padding:10px 14px;border-radius:14px;font-size:15px;font-weight:600;max-width:220px;cursor:pointer;line-height:1.3}
.bubble{animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--s) 55%,transparent),0 14px 30px -10px rgba(0,0,0,.45)}70%{box-shadow:0 0 0 16px transparent,0 14px 30px -10px rgba(0,0,0,.45)}100%{box-shadow:0 0 0 0 transparent,0 14px 30px -10px rgba(0,0,0,.45)}}
.bubble{width:62px;height:62px;border-radius:50%;background:var(--s);color:#fff;display:grid;place-items:center;box-shadow:0 14px 30px -10px rgba(0,0,0,.45);position:relative}
.bubble svg{width:28px;height:28px}
.bubble .dot{position:absolute;top:4px;right:4px;width:14px;height:14px;border-radius:50%;background:#22c55e;border:2px solid #fff}
.veil{position:fixed;inset:0;z-index:45;background:rgba(10,8,12,.55)}
.chat{position:fixed;z-index:50;left:50%;top:50%;transform:translate(-50%,-50%);width:440px;max-width:calc(100vw - 32px);height:min(720px,calc(100vh - 32px));background:#fff;border-radius:20px;box-shadow:0 30px 70px -20px rgba(0,0,0,.45);display:flex;flex-direction:column;overflow:hidden}
@media (max-width:560px){.chat{left:0;top:0;transform:translateY(var(--vvt,0px));width:100%;max-width:none;height:var(--vvh,100dvh);border-radius:0}}
html.lock,html.lock body{overflow:hidden;overscroll-behavior:none}
.msgs{min-height:0;overscroll-behavior:contain}
.msgs>*{flex-shrink:0}
.sbar{display:flex;align-items:center;gap:8px;background:#eef6ff;color:#1e3a5f;font-size:12.5px;padding:6px 10px 6px 14px;border-bottom:1px solid #d6e6f7}
.sbar span{flex:1}
.sbar button{border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:700;background:var(--p);color:#fff;white-space:nowrap}
.acts{display:flex;flex-direction:column;gap:6px;align-self:flex-start;max-width:85%}
.acts button{text-align:left;border:1px solid var(--s);color:var(--s);background:#fff;border-radius:14px;padding:8px 12px;font-size:14px;font-weight:500;line-height:1.3}
.acts button.pri{background:var(--s);color:#fff;font-weight:600;text-align:center}
.simgo{padding:8px 12px 0;background:#fff}
.simgo button{width:100%;background:var(--s);color:#fff;border-radius:12px;padding:11px;font-weight:600;font-size:15px}
.pcard{align-self:flex-start;width:min(280px,85%);background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pcard img{display:block;width:100%;height:150px;object-fit:cover;background:#eee}
.pcard .pc{padding:10px 12px 12px;display:grid;gap:3px}
.pcard b{font-size:14.5px;line-height:1.3}
.pcard small{color:var(--mute);font-size:13px}
.pcard .pr{font-weight:700;color:var(--ink);font-size:15px}
.pcard a{color:var(--s);font-weight:600;font-size:13.5px;text-decoration:none;margin-top:2px}
.kclose{align-self:stretch;background:#fff;border:1.5px solid var(--s);border-radius:16px;padding:14px;display:grid;gap:8px;font-size:15px;line-height:1.4}
.kclose .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.kclose .row a,.kclose .row button{flex:1 1 auto;text-align:center;border-radius:99px;padding:9px 12px;font-size:14px;font-weight:600;text-decoration:none;border:1px solid var(--s);color:var(--s);background:#fff}
.kclose .row .pri{background:var(--s);color:#fff}
.kclose .precio{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:8px}
.kclose .pt{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.kclose .precio .wa{display:block;text-align:center;background:#25D366;color:#fff;border-radius:99px;padding:10px 12px;font-weight:600;text-decoration:none}
.ch .pbtn{width:auto;height:32px;padding:0 11px;border:1px solid rgba(255,255,255,.45);border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap}
.ch .mono{color:#fff}
.ch{background:var(--p);color:#fff;padding:14px 14px;display:flex;align-items:center;gap:10px}
.ch .mono{width:38px;height:38px;font-size:15px;border-radius:10px}
.ch img{height:38px;width:38px;object-fit:contain;background:#fff;border-radius:10px;padding:3px}
.ch-t{min-width:0;flex:1}
.ch-t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-t small{font-size:12px;opacity:.8}
.ch button{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px}
.ch button:hover{background:rgba(255,255,255,.12)}
.cdemo{background:#fff8e6;color:#7a5b00;font-size:12px;padding:6px 14px;text-align:center;border-bottom:1px solid #f1e3b5}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:#fafaf8}
.m{max-width:85%;padding:10px 13px;border-radius:16px;font-size:15px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word}
.m.b{background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px;align-self:flex-start}
.m.u{background:var(--s);color:#fff;border-bottom-right-radius:5px;align-self:flex-end}
.m.sys{align-self:center;background:none;color:var(--mute);font-size:13px;text-align:center}
.typing{display:inline-flex;gap:4px}.typing i{width:7px;height:7px;border-radius:50%;background:#b5b5bd;animation:bl 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,80%,100%{opacity:.3}40%{opacity:1}}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 10px;background:#fafaf8}
.chips button{border:1px solid var(--s);color:var(--s);background:#fff;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:500}
form.in{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
form.in textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:14px;padding:10px 12px;font:inherit;font-size:16px;max-height:110px;outline:none}
form.in textarea:focus{border-color:var(--s)}
form.in button{width:44px;height:44px;border-radius:50%;background:var(--s);color:#fff;display:grid;place-items:center;align-self:flex-end}
form.in button:disabled{opacity:.45}
.note{font-size:11px;color:var(--mute);text-align:center;padding:0 12px 8px}

/* panel */
.panel{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto}
.ptop{position:sticky;top:0;background:var(--p);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:8px;z-index:2}
.ptop b{font-size:17px;flex:1}
.ptop button{border:1px solid rgba(255,255,255,.4);border-radius:99px;padding:7px 13px;font-size:14px;font-weight:600}
.pin{max-width:820px;margin:0 auto;padding:14px 16px 60px}
.pintro{color:var(--mute);font-size:14px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:22px;line-height:1.2}
.stat small{font-size:12.5px;color:var(--mute)}
.stat.g b{color:#15803d}.stat.o b{color:var(--s)}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
@media (max-width:640px){.charts{grid-template-columns:1fr}}
.chart{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
.chart h4{font-size:13px;font-weight:600;margin-bottom:10px}
.bars{display:flex;align-items:flex-end;gap:3px;height:70px}
.bars i{flex:1;background:var(--s);opacity:.85;border-radius:3px 3px 0 0;min-height:2px}
.bars i.z{background:var(--line)}
.bx{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-top:4px}
.tops{display:grid;gap:8px}
.top .tl{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.top .tl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .tb{height:6px;background:var(--line);border-radius:9px;margin-top:4px;overflow:hidden}
.top .tb i{display:block;height:100%;background:var(--s);border-radius:9px}
.filters{display:grid;gap:8px;margin-bottom:12px}
.fchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.fchips button{flex:none;border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:500}
.fchips button.on{background:var(--p);border-color:var(--p);color:#fff}
.fsel{display:grid;grid-template-columns:repeat(3,1fr) 1.4fr;gap:6px}
@media (max-width:560px){.fsel{grid-template-columns:1fr 1fr}}
.fsel select,.fsel input{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:14px;background:#fff}
.count{font-size:13px;color:var(--mute);margin-bottom:8px}
.lead{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.lead.done{opacity:.72}
.lh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;display:inline-flex;align-items:center;gap:6px}
.badge::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.caliente{background:#dcfce7;color:#15803d}.tibio{background:#fef3c7;color:#a16207}.frio{background:#eef0f2;color:#4b5563}
.tag{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:#f1efe9;color:var(--mute)}
.tag.ej{background:#eef2ff;color:#4338ca}.tag.ok{background:#dcfce7;color:#15803d}.tag.yo{background:var(--s);color:#fff}
.lh time{font-size:12.5px;color:var(--mute);margin-left:auto}
.lead p{font-size:15px}
.kv{font-size:14px;color:var(--mute);margin-top:6px}
.kv b{color:var(--ink);font-weight:600}
.lact{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.lact button,.lact a{border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;background:#fff;text-decoration:none;color:var(--ink)}
.lact a.wa{background:#25D366;border-color:#25D366;color:#fff}
.lact .dis{opacity:.45;pointer-events:none}
details{margin-top:10px}
summary{cursor:pointer;color:var(--s);font-size:14px;font-weight:600}
.conv{margin-top:8px;display:flex;flex-direction:column;gap:6px;background:#fafaf8;border-radius:12px;padding:10px}
.conv .m{font-size:14px}

/* panel: pestañas y propiedades */
.ptabs{position:sticky;top:57px;z-index:2;display:flex;gap:6px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.ptabs button{flex:1;max-width:200px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 12px;font-size:14px;font-weight:600}
.ptabs button.on{background:var(--p);border-color:var(--p);color:#fff}
.pacts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pacts button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 13px;font-size:13.5px;font-weight:600}
.pacts button.pri{background:var(--s);border-color:var(--s);color:#fff}
.prow{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;margin-bottom:8px;cursor:pointer}
.prow img,.prow .nofoto{width:64px;height:64px;border-radius:10px;object-fit:cover;flex:none;background:#eceae4}
.prow .pinfo{flex:1;min-width:0;display:grid;gap:1px}
.prow .pinfo b{font-size:14px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .pinfo small{font-size:12.5px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .pp{font-size:14px;font-weight:700}
.pest{flex:none;border:1px solid var(--line);border-radius:99px;padding:6px 8px;font:inherit;font-size:12.5px;font-weight:600;background:#fff;max-width:118px}
.e-disponible .pest{background:#dcfce7;border-color:#bbf7d0;color:#15803d}
.e-reservada .pest{background:#fef3c7;border-color:#fde68a;color:#a16207}
.e-vendida .pest,.e-alquilada .pest{background:#e0e7ff;border-color:#c7d2fe;color:#3730a3}
.e-pausada .pest{background:#eef0f2;border-color:#e2e4e7;color:#4b5563}
.e-vendida,.e-alquilada,.e-pausada{opacity:.75}
.more{width:100%;border:1px dashed var(--line);background:#fff;border-radius:12px;padding:10px;font-weight:600;font-size:14px;margin:4px 0 12px}
.plog{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:6px}
.lgrow{display:flex;gap:10px;font-size:13.5px;padding:6px 0;border-top:1px solid var(--line)}
.lgrow:first-child{border-top:0}
.lgrow time{color:var(--mute);flex:none;font-size:12.5px;padding-top:1px}
.pmodal{position:fixed;inset:0;z-index:80;background:rgba(10,8,12,.55);display:grid;place-items:center;padding:16px;overflow-y:auto}
.pmbox{background:#fff;border-radius:18px;padding:18px;width:min(560px,100%);max-height:calc(100dvh - 32px);overflow-y:auto}
.pmbox h3{font-size:18px;margin-bottom:12px}
.pform{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pform label{display:grid;gap:4px;font-size:12.5px;color:var(--mute);font-weight:600}
.pform label.full,.pform .full{grid-column:1/-1}
.pform input,.pform select{border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:inherit;font-size:15px;color:var(--ink);background:#fff;width:100%}
.mrow{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.mrow button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:9px 16px;font-weight:600}
.mrow button.pri{background:var(--s);border-color:var(--s);color:#fff}
.ires{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.ires div{background:#fafaf8;border:1px solid var(--line);border-radius:12px;padding:10px}
.ires b{display:block;font-size:20px}.ires small{color:var(--mute);font-size:12.5px}
.ptoast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;background:#16161a;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100vw - 32px);box-shadow:0 12px 30px -10px rgba(0,0,0,.5)}

/* estados */
.state{min-height:calc(100vh - 40px);display:grid;place-items:center;padding:24px 16px}
.state .box{max-width:440px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:20px;padding:30px 22px}
.state h1{font-size:24px;margin-bottom:10px}
.state p{color:var(--mute);margin-bottom:18px}
.kbtn{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:99px;font-weight:600;text-decoration:none;margin-top:8px}
.kbtn.wa{background:#25D366;color:#fff}.kbtn.ml{border:1.5px solid var(--k-navy);color:var(--k-navy)}
.loading{min-height:70vh;display:grid;place-items:center;color:var(--mute)}
/* tema WhatsApp: la demo simula el WhatsApp de la inmobiliaria */
.bubble{background:#25d366}
.bubble .dot{display:none}
.tip{border-color:#25d366}
.chat{--s:#00a884;background:#efeae2}
.ch{background:#008069}
.ch .pbtn{border-color:rgba(255,255,255,.55)}
.ch-t small{opacity:.85}
.cdemo{background:#fff3c4;color:#54656f;border-bottom:0;font-size:11.5px}
.sbar{background:#d9fdd3;color:#0b4a3b;border-bottom:1px solid #c5ebc0}
.sbar button{background:#008069}
.msgs{background-color:#efeae2;background-image:radial-gradient(rgba(84,101,111,.07) 1px,transparent 1.2px);background-size:18px 18px;gap:6px}
.m{font-size:15px;line-height:1.38;padding:7px 10px 8px;border-radius:8px;box-shadow:0 1px .5px rgba(11,20,26,.13)}
.m.b{background:#fff;border:0;border-top-left-radius:0;color:#111b21}
.m.u{background:#d9fdd3;color:#111b21;border-top-right-radius:0}
.m.sys{box-shadow:none;background:#ffffffcc;color:#54656f;font-size:12.5px;border-radius:8px;padding:5px 10px}
.acts button{border:0;background:#fff;color:#008069;border-radius:8px;box-shadow:0 1px .5px rgba(11,20,26,.13);font-weight:600}
.acts button.pri{background:#00a884;color:#fff}
.pcard{border:0;border-radius:8px;box-shadow:0 1px .5px rgba(11,20,26,.13)}
.pcard a{color:#027eb5}
.simgo{background:#efeae2}
.simgo button{background:#00a884}
form.in{background:#f0f2f5;border-top:0}
form.in textarea{border:0;border-radius:22px;background:#fff;padding:10px 14px}
form.in button{background:#00a884}
.note{background:#f0f2f5;padding-bottom:8px}
.kclose{border:0;box-shadow:0 1px .5px rgba(11,20,26,.13);border-radius:10px}
.ch .pbtn{position:relative}
.pbtn .nb{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 4px;border-radius:99px;background:#25D366;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px #008069}
.pbtn.pulse{animation:kpl 1.3s ease-out 4}
@keyframes kpl{0%{box-shadow:0 0 0 0 rgba(255,255,255,.75)}100%{box-shadow:0 0 0 13px rgba(255,255,255,0)}}
.hint{align-self:center;max-width:92%;background:#fff3c4;color:#54656f;font-size:13px;line-height:1.35;border-radius:8px;padding:7px 12px;text-align:center;box-shadow:0 1px .5px rgba(11,20,26,.13)}
.hint button{border:0;background:none;color:#008069;font-weight:700;font-size:13px;padding:0 0 0 4px;text-decoration:underline;cursor:pointer}
.kclose .big{display:block;width:100%;border:0;border-radius:99px;padding:12px;font-size:15px;font-weight:700;background:#00a884;color:#fff;cursor:pointer}
.kclose .pm{display:grid;gap:3px;font-size:15px}.kclose .pm small{color:var(--mute);font-size:13px}
.lead.mia{border:2px solid #00a884}
.tag.mia{background:#00a884;color:#fff;border-color:#00a884}
.mtit{margin:4px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:#008069}
.lead .auto{margin:0;font-size:12.5px;color:#008069}
.kclose .row a,.kclose .row button{border-color:#00a884;color:#008069}
.kclose .row .pri{background:#00a884;color:#fff}
</style>
</head>
<body>
<div class="kband" id="kband"></div>
<div id="app"><div class="loading">Cargando demo…</div></div>

<script>
(() => {
  const SB = "https://pekqdgyxrqqjhmxtjovp.supabase.co";
  const KEY = "sb_publishable_f-knrak9HDgsY49k-0oYvg_gIqIYQbS";
  const BOT = SB + "/functions/v1/demo-bot";
  const NEUTRA = "inmobiliaria-demo";
  const WA = "https://wa.me/5491132654042";
  const MAIL = "hola@kiondaia.com";

  const qs = new URLSearchParams(location.search);
  const slug = (qs.get("i") || NEUTRA).trim().toLowerCase();
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };
  const app = $("#app"), band = $("#kband");

  const ICON_WA = '<svg viewBox="0 0 32 32" width="32" height="32" aria-hidden="true"><path fill="#fff" d="M16 3C8.8 3 3 8.7 3 15.8c0 2.5.7 4.9 2 7L3.2 29l6.4-1.7c2 1.1 4.2 1.6 6.4 1.6 7.2 0 13-5.7 13-12.8S23.2 3 16 3zm0 23.6c-2 0-3.9-.5-5.6-1.5l-.4-.2-3.8 1 1-3.7-.3-.4c-1.1-1.7-1.7-3.7-1.7-5.8C5.2 9.9 10 5.2 16 5.2s10.8 4.7 10.8 10.6S22 26.6 16 26.6z"/><path fill="#fff" d="M22 18.7c-.3-.2-1.9-.9-2.2-1-.3-.1-.5-.2-.7.2-.2.3-.8 1-1 1.2-.2.2-.4.2-.7.1-.3-.2-1.4-.5-2.6-1.6-1-.9-1.6-1.9-1.8-2.2-.2-.3 0-.5.1-.7l.5-.6c.2-.2.2-.3.3-.6.1-.2 0-.4 0-.6l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.1 1.1-1.1 2.6s1.2 3 1.3 3.2c.2.2 2.3 3.5 5.5 4.9.8.3 1.4.5 1.9.7.8.2 1.5.2 2.1.1.6-.1 1.9-.8 2.2-1.5.3-.7.3-1.4.2-1.5-.1-.1-.3-.2-.6-.3z"/></svg>';
  const ICON_CHAT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>';
  const ICON_HOUSE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>';
  const ICON_SEND = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

  async function rpc(fn, args) {
    const r = await fetch(`${SB}/rest/v1/rpc/${fn}`, {
      method: "POST",
      headers: { apikey: KEY, "content-type": "application/json" },
      body: JSON.stringify(args),
    });
    if (!r.ok) throw new Error(fn + " " + r.status);
    return r.json();
  }

  const fmtDate = (d) => {
    const [y, m, day] = String(d).split("-");
    return `${day}/${m}/${y}`;
  };
  const initials = (n) => n.replace(/\(.*?\)/g, "").split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join("").toUpperCase();
  const safeColor = (c, def) => (/^#[0-9a-f]{6}$/i.test(c || "") ? c : def);
  const safeUrl = (u) => (/^https:\/\//i.test(u || "") ? u : "");

  function contactBlock() {
    return `<a class="kbtn wa" href="${WA}" target="_blank" rel="noopener">WhatsApp +54 9 11 3265-4042</a>
            <a class="kbtn ml" href="mailto:${MAIL}">${MAIL}</a>`;
  }

  function showState(title, text) {
    band.innerHTML = `<span class="pill">Demo</span><span>Asistente virtual por <b>kionda IA</b></span>`;
    app.innerHTML = `<div class="state"><div class="box"><h1>${esc(title)}</h1><p>${esc(text)}</p>${contactBlock()}</div></div>`;
  }

  // ---------- arranque ----------
  rpc("get_demo", { p_slug: slug }).then((res) => {
    if (res.estado === "activa") return render(res.demo);
    if (res.estado === "finalizada")
      return showState("Esta demo ya finalizó", `La demo del asistente virtual para ${res.nombre} ya no está disponible. Si desea verla nuevamente o tener el asistente en su web, puede escribirnos.`);
    return showState("Demo no encontrada", "El enlace no corresponde a ninguna demo activa. Si se lo enviaron, puede escribirnos y le enviamos uno nuevo.");
  }).catch(() => showState("No pudimos cargar la demo", "Revise su conexión e intente nuevamente en unos minutos."));

  function render(d) {
    const neutra = d.tipo === "neutra";
    document.documentElement.style.setProperty("--p", safeColor(d.color_principal, "#1f2937"));
    document.documentElement.style.setProperty("--s", safeColor(d.color_secundario, "#2563eb"));
    document.title = `${d.nombre} · Demo de asistente virtual`;
    const logo = safeUrl(d.logo_url);
    const mark = logo ? `<img src="${esc(logo)}" alt="${esc(d.nombre)}" onerror="this.outerHTML='<div class=mono>${esc(initials(d.nombre))}</div>'">` : `<div class="mono">${esc(initials(d.nombre))}</div>`;
    const props = Array.isArray(d.propiedades) ? d.propiedades : [];

    band.innerHTML = neutra
      ? `<span class="pill">Demo</span><span>Inmobiliaria ficticia · Asistente virtual por <b>kionda IA</b></span>`
      : `<span class="pill">Demo</span><span>Preparada por <b>kionda IA</b> para ${esc(d.nombre)} · disponible hasta el ${fmtDate(d.vence)}</span>`;

    const celu = safeUrl(d.captura_celu), compu = safeUrl(d.captura_compu);
    const tactil = window.matchMedia("(hover: none)").matches;
    const fondo = (celu || compu)
      ? `<div class="shot" aria-label="Así se ve la web de ${esc(d.nombre)}">
           <picture>
             ${celu ? `<source media="(max-width: 700px)" srcset="${esc(celu)}">` : ""}
             <img id="shotImg" src="${esc(compu || celu)}" alt="" draggable="false">
           </picture>
           <div class="guard"></div><div class="fade"></div>
         </div>
         <div class="after">Captura de la web de ${esc(d.nombre)} · el asistente se encuentra abajo a la derecha</div>`
      : plainBox(d, mark, neutra);

    app.innerHTML = `
      <div id="bg">${fondo}</div>

      <div class="dim" aria-hidden="true"></div>
      <div class="launch" id="launch">
        <div class="tip" id="tip">${tactil ? "Toque aquí" : "Haga clic aquí"} para probar el asistente por WhatsApp</div>
        <button class="bubble" id="bubble" aria-label="Abrir el asistente por WhatsApp">${ICON_WA}<span class="dot"></span></button>
      </div>

      <div class="veil hide" id="veil"></div>
      <section class="chat hide" id="chat" aria-label="Asistente virtual">
        <div class="ch">${mark}<div class="ch-t"><b>${esc(d.nombre)}</b><small>en línea · asistente virtual</small></div>
          <button class="pbtn" id="openPanel">Ver panel</button>
          <button id="reset" title="Empezar de nuevo" aria-label="Empezar de nuevo">↻</button>
          <button id="close" title="Cerrar" aria-label="Cerrar">✕</button></div>
        <div class="cdemo" id="cdemo">Simulación de WhatsApp · demo del asistente con IA</div>
        <div class="sbar hide" id="sbar"><span>Simulación en curso · escriba como si fuera un cliente</span><button type="button" id="endSim">Finalizar simulación</button></div>
        <div class="msgs" id="msgs"></div>
        <div class="simgo hide" id="simgo"><button type="button" id="startSim">▶ Empezar simulación</button></div>
        <form class="in" id="form"><textarea id="txt" rows="1" placeholder="Escriba su consulta…" maxlength="1200"></textarea><button id="send" aria-label="Enviar">${ICON_SEND}</button></form>
        <div class="note">Asistente con IA. Puede cometer errores.</div>
      </section>

      <section class="panel hide" id="panel"></section>`;

    // si la captura no carga, se muestra el fondo simple
    const img = $("#shotImg");
    if (img) img.onerror = () => { $("#bg").innerHTML = plainBox(d, mark, neutra); };

    setupChat(d, props);
    setupPanel(d);
  }

  function plainBox(d, mark, neutra) {
    return `<div class="plain"><div class="box">
        <div class="mark">${mark}</div>
        <h1>${neutra ? "Asistente virtual de " + esc(d.nombre) : "Asistente virtual para " + esc(d.nombre)}</h1>
        <p>Así atendería las consultas de ${neutra ? "una inmobiliaria" : "su web"}: responde a cualquier hora, pregunta qué busca cada persona y deja los interesados ordenados en un panel. Puede probarlo con el botón de abajo.</p>
      </div></div>`;
  }

  // ---------- chat ----------
  const BOT_WA = "5491132654042";
  const SESION = new Set(); // conversaciones de esta visita (lo único "real" que muestra el panel)
  function saludoHora() {
    const h = new Date().getHours();
    return h >= 5 && h < 13 ? "Buen día" : h >= 13 && h < 20 ? "Buenas tardes" : "Buenas noches";
  }
  function introPresentacion(d, n) {
    const neutra = d.tipo === "neutra";
    return neutra
      ? `${saludoHora()}. Soy una demo del asistente virtual que podría tener una inmobiliaria.\nPara esta prueba usamos ${n} propiedades de una inmobiliaria ficticia; la versión real incluye todas las que publiquen.\n¿Les gustaría hacerme alguna pregunta antes de empezar la simulación? Desde ya, gracias por su atención.`
      : d.n_admin
      ? `${saludoHora()}. Soy una demo del asistente virtual que podría tener ${d.nombre}.\nPara esta prueba cargamos las ${d.n_admin} propiedades publicadas en su web, que también puede administrar desde el panel.\n¿Les gustaría hacerme alguna pregunta antes de empezar la simulación? Desde ya, gracias por su atención.`
      : `${saludoHora()}. Soy una demo del asistente virtual que podría tener ${d.nombre}.\nPara esta prueba cargamos ${n} propiedades de su web; la versión real incluye todas las que publiquen.\n¿Les gustaría hacerme alguna pregunta antes de empezar la simulación? Desde ya, gracias por su atención.`;
  }
  const TEXTO_CIERRE = "Gracias por probar la demo. Así le llegó esta consulta a su equipo:";
  const PRECIO_HTML = `<div class="pm"><div><b>USD 150</b> de instalación, con <b>1 mes de prueba</b> incluido</div><div>Si le convence: <b>USD 150</b> más y <b>USD 30 por mes</b></div><small>Si no le convence, no paga nada más. Incluye todo: su WhatsApp, su web, sus propiedades y el panel.</small></div>`;

  function setupChat(d, props) {
    const K = "demo2:" + d.slug;
    const root = document.documentElement;
    const chat = $("#chat"), msgs = $("#msgs"), txt = $("#txt"), form = $("#form"), send = $("#send"),
      launch = $("#launch"), veil = $("#veil"), sbar = $("#sbar"), simgo = $("#simgo"), cdemo = $("#cdemo");
    const tactil = window.matchMedia("(hover: none)").matches;
    const nuevo = () => ({ id: null, log: [], done: false });
    let modo = "presentacion";
    const st = { presentacion: nuevo(), simulacion: nuevo() };
    for (const m of ["presentacion", "simulacion"]) {
      void m; // cada visita arranca de cero: no se guarda nada en el navegador
    }
    // aviso tipo "mensaje sin leer" en el botón Ver panel
    let vistasPanel = 0;
    function badge() {
      const b = $("#openPanel"); if (!b) return;
      const n = SESION.size - vistasPanel;
      let nb = b.querySelector(".nb");
      if (n > 0) {
        if (!nb) { nb = document.createElement("span"); nb.className = "nb"; b.appendChild(nb); b.classList.remove("pulse"); void b.offsetWidth; b.classList.add("pulse"); }
        nb.textContent = n;
      } else if (nb) { nb.remove(); b.classList.remove("pulse"); }
    }
    window.__panelVisto = () => { vistasPanel = SESION.size; badge(); };
    const save = () => { if (st.simulacion.id) SESION.add(st.simulacion.id); badge(); };
    function hint() {
      const el = document.createElement("div");
      el.className = "hint";
      el.innerHTML = `Esta consulta ya está llegando al panel de su inmobiliaria.<button type="button">Ver panel</button>`;
      el.querySelector("button").addEventListener("pointerdown", (e) => e.preventDefault());
      el.querySelector("button").onclick = () => $("#openPanel").click();
      msgs.appendChild(el);
    }
    const S = () => st[modo];
    const podes = "puede";
    let busy = false;

    // --- que el chat siga al teclado (tipo WhatsApp) ---
    let pegado = true;
    msgs.addEventListener("scroll", () => { pegado = msgs.scrollHeight - msgs.scrollTop - msgs.clientHeight < 80; });
    const abajo = () => { msgs.scrollTop = msgs.scrollHeight; };
    const vv = window.visualViewport;
    function fit() {
      if (vv) {
        root.style.setProperty("--vvh", vv.height + "px");
        root.style.setProperty("--vvt", vv.offsetTop + "px");
      }
      if (pegado) requestAnimationFrame(abajo);
    }
    if (vv) { vv.addEventListener("resize", fit); vv.addEventListener("scroll", fit); }
    window.addEventListener("resize", fit);

    // --- piezas de la conversacion ---
    function add(role, text) {
      const el = document.createElement("div");
      el.className = "m " + role;
      el.textContent = text;
      msgs.appendChild(el);
      return el;
    }
    function botones(lista) {
      const box = document.createElement("div");
      box.className = "acts";
      lista.forEach(([label, fn, pri]) => {
        const b = document.createElement("button");
        b.type = "button"; b.textContent = label; if (pri) b.className = "pri";
        b.addEventListener("pointerdown", (e) => e.preventDefault());
        b.onclick = fn;
        box.appendChild(b);
      });
      msgs.appendChild(box);
      return box;
    }
    function tarjeta(i) {
      const p = props[i - 1];
      if (p) tarjetaObj(p);
    }
    let vistas = new Set();
    const claveT = (p) => p.link || p.titulo;
    function tarjetaObj(p) {
      vistas.add(claveT(p));
      const foto = safeUrl(p.foto), link = safeUrl(p.link);
      const meta = [p.operacion, p.barrio, p.ambientes ? p.ambientes + " amb." : ""].filter(Boolean).map(esc).join(" · ");
      const el = document.createElement("div");
      el.className = "pcard";
      el.innerHTML = `${foto ? `<img src="${esc(foto)}" alt="" loading="lazy" onerror="this.remove()">` : ""}
        <div class="pc"><b>${esc(p.titulo || "Propiedad")}</b>${meta ? `<small>${meta}</small>` : ""}
        <span class="pr">${esc(p.precio || "Precio a consultar")}</span>
        ${link ? `<a href="${esc(link)}" target="_blank" rel="noopener">Ver aviso en su web ↗</a>` : ""}</div>`;
      const img = el.querySelector("img");
      if (img) img.addEventListener("load", () => { if (pegado) abajo(); });
      msgs.appendChild(el);
    }
    function cierre(fin) {
      const el = document.createElement("div");
      el.className = "kclose";
      const wa = `https://wa.me/${BOT_WA}?text=${encodeURIComponent(`Hola, vengo por la demo de ${d.nombre} (código ${d.slug})`)}`;
      el.innerHTML = `<div>${esc(TEXTO_CIERRE)}</div>
        <button type="button" class="big" data-a="panel">Ver mi consulta en el panel</button>
        <div class="precio ${fin.precio ? "" : "hide"}"><div class="pt">Precio</div>${PRECIO_HTML}
          <a class="wa" href="${wa}" target="_blank" rel="noopener">Enviar mensaje por WhatsApp</a></div>
        <div class="row">${fin.precio ? "" : `<button type="button" data-a="precio">Me interesa saber el precio</button>`}
        <button type="button" data-a="otra">Simular de nuevo</button></div>`;
      const bp = el.querySelector('[data-a="precio"]');
      if (bp) bp.onclick = () => { fin.precio = true; save(); el.querySelector(".precio").classList.remove("hide"); bp.remove(); if (pegado) abajo(); };
      el.querySelector('[data-a="panel"]').onclick = () => $("#openPanel").click();
      el.querySelector('[data-a="otra"]').onclick = () => { st.simulacion = nuevo(); save(); draw(); };
      msgs.appendChild(el);
    }

    function draw() {
      msgs.innerHTML = "";
      const s = S();
      const sim = modo === "simulacion";
      sbar.classList.toggle("hide", !sim || s.done);
      cdemo.classList.toggle("hide", sim && !s.done);
      simgo.classList.toggle("hide", sim || s.log.length === 0);
      if (!sim) {
        add("b", introPresentacion(d, props.length));
        if (!s.log.length) botones([
          ["▶ Empezar simulación", empezarSim, true],
          ["¿Qué incluye el servicio?", () => ask("¿Qué incluye el servicio?")],
          ["¿Cómo funciona por WhatsApp?", () => ask("¿Cómo funciona por WhatsApp?")],
        ]);
      } else {
        add("b", d.saludo || `Hola, soy el asistente virtual de ${d.nombre}. ¿Está buscando comprar, alquilar o tasar una propiedad?`);
      }
      vistas = new Set();
      s.log.forEach((m) => {
        if (m.r === "fin") return cierre(m);
        if (m.r === "hint") return hint();
        add(m.r, m.t);
        (m.m || []).forEach(tarjeta);
        (m.tj || []).forEach(tarjetaObj);
      });
      txt.disabled = send.disabled = s.done;
      txt.placeholder = sim ? "Escriba como si fuera un cliente…" : "Escriba su pregunta…";
      pegado = true; requestAnimationFrame(abajo);
    }

    function empezarSim() {
      modo = "simulacion";
      if (S().done) st.simulacion = nuevo();
      save(); draw();
    }
    function terminarSim() {
      const s = st.simulacion;
      if (s.done) return;
      s.done = true; s.log.push({ r: "fin" }); save(); draw();
    }

    function open() {
      chat.classList.remove("hide"); veil.classList.remove("hide"); launch.classList.add("hide");
      root.classList.add("lock");
      fit(); draw();
      if (!tactil) setTimeout(() => txt.focus(), 50);
    }
    function close() {
      chat.classList.add("hide"); veil.classList.add("hide"); launch.classList.remove("hide");
      root.classList.remove("lock"); txt.blur();
    }

    async function ask(text) {
      text = text.trim();
      const s = S(), m0 = modo;
      if (!text || busy || s.done) return;
      busy = true; send.disabled = true;
      msgs.querySelectorAll(".acts").forEach((x) => x.remove());
      s.log.push({ r: "u", t: text }); add("u", text); save();
      simgo.classList.toggle("hide", m0 === "simulacion");
      txt.value = ""; txt.style.height = "";
      const t = add("b", ""); t.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
      pegado = true; abajo();
      try {
        const r = await fetch(BOT, {
          method: "POST",
          headers: { "content-type": "application/json", apikey: KEY },
          body: JSON.stringify({ slug: d.slug, message: text, id: s.id, modo: m0 }),
        });
        const j = await r.json();
        if (j.id) s.id = j.id;
        const reply = j.reply || "Tuve un problema para responder. ¿Podría intentar de nuevo?";
        t.textContent = reply;
        const most = Array.isArray(j.mostrar) ? j.mostrar : [];
        const tj = (Array.isArray(j.tarjetas) ? j.tarjetas : []).filter((x) => !vistas.has(claveT(x))).slice(0, 2);
        s.log.push({ r: "b", t: reply, m: most, tj });
        most.forEach(tarjeta);
        tj.forEach(tarjetaObj);
        if (m0 === "simulacion" && j.id && !s.hint && s.log.filter((x) => x.r === "b").length >= 2) {
          s.hint = true; s.log.push({ r: "hint" }); hint();
        }
        if (j.finalizada) setTimeout(() => location.reload(), 2500);
        else if (j.done) {
          if (m0 === "simulacion") { s.done = true; s.log.push({ r: "fin" }); save(); busy = false; return draw(); }
          s.done = true; add("sys", "Conversación finalizada · toque ↻ para empezar otra");
        }
      } catch {
        t.textContent = "No pude conectarme. Revise su conexión e intente nuevamente.";
        s.log.pop();
      }
      save();
      busy = false; send.disabled = s.done; txt.disabled = s.done;
      if (pegado) abajo();
    }

    $("#bubble").onclick = open;
    $("#tip").onclick = open;
    veil.onclick = close;
    $("#close").onclick = close;
    $("#startSim").onclick = empezarSim;
    $("#endSim").onclick = terminarSim;
    $("#reset").onclick = () => {
      if (modo === "simulacion") { modo = "presentacion"; st.presentacion = nuevo(); st.simulacion = nuevo(); }
      else st.presentacion = nuevo();
      save(); draw();
    };
    // el teclado no se cierra al tocar enviar
    send.addEventListener("pointerdown", (e) => e.preventDefault());
    form.onsubmit = (e) => { e.preventDefault(); ask(txt.value); };
    txt.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !tactil) { e.preventDefault(); ask(txt.value); } });
    txt.addEventListener("input", () => { txt.style.height = "auto"; txt.style.height = Math.min(txt.scrollHeight, 110) + "px"; });
    txt.addEventListener("focus", () => { pegado = true; setTimeout(fit, 250); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
  }

  // ---------- panel ----------
  const NIVEL = { caliente: "Para contactar", tibio: "Interesado", frio: "Explorando" };
  const OPER = { compra: "Compra", alquiler: "Alquiler", tasacion: "Tasación", otro: "Otro" };
  // horario comercial de referencia: lunes a viernes 9 a 18 h, sábados 9 a 13 h (hora de Argentina)
  function fueraDeHorario(iso) {
    const t = new Date(new Date(iso).toLocaleString("en-US", { timeZone: "America/Argentina/Buenos_Aires" }));
    const dia = t.getDay(), h = t.getHours() + t.getMinutes() / 60;
    if (dia === 0) return true;
    if (dia === 6) return !(h >= 9 && h < 13);
    return !(h >= 9 && h < 18);
  }
  function waLink(contacto, nombre, inmo) {
    let n = String(contacto || "").replace(/\D/g, "");
    if (n.length < 8) return "";
    if (n.startsWith("0")) n = n.slice(1);
    if (n.startsWith("15")) n = n.slice(2);
    if (!n.startsWith("54")) n = "549" + n;
    const txt = `Hola${nombre ? " " + nombre.split(" ")[0] : ""}, le escribimos de ${inmo} por su consulta.`;
    return `https://wa.me/${n}?text=${encodeURIComponent(txt)}`;
  }

  function setupPanel(d) {
    const panel = $("#panel");
    const neutra = d.tipo === "neutra";
    const props = Array.isArray(d.propiedades) ? d.propiedades : [];
    const when = (s) => new Date(s).toLocaleString("es-AR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
    const f = { nivel: "", oper: "", fecha: "", estado: "", q: "" };
    let rows = [];

    function filtrar() {
      const ahora = Date.now(), q = f.q.trim().toLowerCase();
      return rows.filter((r) => {
        if (f.nivel && r.calificacion !== f.nivel) return false;
        if (f.oper && r.operacion !== f.oper) return false;
        if (f.estado && r.estado !== f.estado) return false;
        if (f.fecha) {
          const dias = { hoy: 1, "7": 7, "30": 30 }[f.fecha];
          if (ahora - new Date(r.fecha).getTime() > dias * 864e5) return false;
        }
        if (q && !`${r.nombre || ""} ${r.busca || ""} ${r.resumen || ""}`.toLowerCase().includes(q)) return false;
        return true;
      });
    }

    function estadisticas() {
      const total = rows.length;
      const cal = rows.filter((r) => r.calificacion === "caliente").length;
      const pend = rows.filter((r) => r.calificacion === "caliente" && r.estado !== "contactado").length;
      const fuera = rows.filter((r) => fueraDeHorario(r.fecha)).length;
      // consultas por dia (ultimos 14)
      const dias = [];
      for (let i = 13; i >= 0; i--) {
        const dt = new Date(Date.now() - i * 864e5);
        const key = dt.toLocaleDateString("es-AR", { timeZone: "America/Argentina/Buenos_Aires" });
        dias.push({ key, n: 0 });
      }
      rows.forEach((r) => {
        const key = new Date(r.fecha).toLocaleDateString("es-AR", { timeZone: "America/Argentina/Buenos_Aires" });
        const x = dias.find((z) => z.key === key); if (x) x.n++;
      });
      const max = Math.max(1, ...dias.map((z) => z.n));
      // propiedades mas consultadas
      const cuenta = props.map(() => 0);
      rows.forEach((r) => (r.props || []).forEach((k) => { if (cuenta[k - 1] !== undefined) cuenta[k - 1]++; }));
      const top = cuenta.map((n, i) => ({ n, t: props[i].titulo || "Propiedad" })).filter((x) => x.n).sort((a, b) => b.n - a.n).slice(0, 4);
      const tmax = Math.max(1, ...top.map((x) => x.n));
      return `
        <div class="stats">
          <div class="stat"><b>${total}</b><small>Consultas</small></div>
          <div class="stat g"><b>${cal}</b><small>Para contactar</small></div>
          <div class="stat"><b>${pend}</b><small>Sin contactar aún</small></div>
          <div class="stat o"><b>${total ? Math.round((100 * fuera) / total) : 0}%</b><small>Fuera del horario comercial</small></div>
        </div>
        <div class="charts">
          <div class="chart"><h4>Consultas por día (últimos 14 días)</h4>
            <div class="bars">${dias.map((z) => `<i class="${z.n ? "" : "z"}" style="height:${Math.max(3, (z.n / max) * 100)}%" title="${z.key}: ${z.n}"></i>`).join("")}</div>
            <div class="bx"><span>${dias[0].key.slice(0, 5)}</span><span>Hoy</span></div></div>
          <div class="chart"><h4>Propiedades más consultadas</h4>
            <div class="tops">${top.length ? top.map((x) => `<div class="top"><div class="tl"><span>${esc(x.t)}</span><b>${x.n}</b></div><div class="tb"><i style="width:${(x.n / tmax) * 100}%"></i></div></div>`).join("") : `<small style="color:var(--mute)">Todavía no hay datos.</small>`}</div></div>
        </div>`;
    }

    function tarjetaLead(r) {
      const wa = !r.ejemplo && !neutra ? waLink(r.contacto, r.nombre, d.nombre) : "";
      const n = (r.mensajes || []).length;
      const mia = SESION.has(r.id);
      return `<article class="lead ${r.estado === "contactado" ? "done" : ""} ${mia ? "mia" : ""}">
        <div class="lh"><span class="badge ${esc(r.calificacion)}">${NIVEL[r.calificacion] || esc(r.calificacion)}</span>
          <b>${esc(r.nombre || "Sin nombre")}</b>
          ${r.ejemplo ? `<span class="tag ej">Ejemplo</span>` : mia ? `<span class="tag mia">Su simulación</span>` : `<span class="tag yo">Real</span>`}
          ${r.operacion ? `<span class="tag">${OPER[r.operacion] || esc(r.operacion)}</span>` : ""}
          ${r.estado === "contactado" ? `<span class="tag ok">Contactada</span>` : ""}
          <time>${when(r.fecha)}${fueraDeHorario(r.fecha) ? " · fuera de horario" : ""}</time></div>
        ${mia ? `<p class="auto">El asistente la calificó y la resumió solo, sin que nadie del equipo intervenga.</p>` : ""}
        <p>${esc(r.resumen || "Conversación en curso.")}</p>
        ${r.busca ? `<div class="kv"><b>Busca:</b> ${esc(r.busca)}</div>` : ""}
        ${r.contacto ? `<div class="kv"><b>Contacto:</b> ${esc(r.contacto)}</div>` : ""}
        <div class="lact">
          <button type="button" data-id="${esc(r.id)}" data-e="${r.estado === "contactado" ? "pendiente" : "contactado"}">${r.estado === "contactado" ? "Marcar como pendiente" : "Marcar como contactada"}</button>
          ${r.contacto ? (wa ? `<a class="wa" href="${wa}" target="_blank" rel="noopener">Escribir por WhatsApp</a>` : `<a class="wa dis" title="Disponible en consultas reales">Escribir por WhatsApp</a>`) : ""}
        </div>
        ${n ? `<details><summary>Ver conversación (${n} mensajes)</summary>
          <div class="conv">${(r.mensajes || []).map((m) => `<div class="m ${m.role === "user" ? "u" : "b"}">${esc(m.text)}</div>`).join("")}</div></details>` : ""}
      </article>`;
    }

    function pintarLista() {
      const mias = rows.filter((r) => SESION.has(r.id));
      const pm = $("#pmia", panel);
      if (pm) pm.innerHTML = mias.length ? `<h4 class="mtit">Su consulta</h4>${mias.map(tarjetaLead).join("")}` : "";
      const lista = filtrar().filter((r) => !SESION.has(r.id));
      $("#plist", panel).innerHTML = `<div class="count">${lista.length} consultas de ejemplo</div>` +
        (lista.length ? lista.map(tarjetaLead).join("") : `<div class="empty">No hay consultas con estos filtros.</div>`);
      panel.querySelectorAll("[data-e]").forEach((btn) => btn.onclick = async () => {
        const r = rows.find((x) => x.id === btn.dataset.id); if (!r) return;
        btn.disabled = true;
        try { await rpc("set_lead_estado", { p_slug: d.slug, p_id: r.id, p_estado: btn.dataset.e }); r.estado = btn.dataset.e; } catch {}
        $("#pstats", panel).innerHTML = estadisticas();
        pintarLista();
      });
    }

    function pintar() {
      const chip = (v, l) => `<button type="button" data-n="${v}" class="${f.nivel === v ? "on" : ""}">${l}</button>`;
      $(".pin", panel).innerHTML = `
        <p class="pintro">${neutra
          ? "Así recibe la inmobiliaria cada consulta: resumida, clasificada por nivel de interés y lista para contactar. En esta demo pública los contactos se muestran ocultos."
          : `Así recibiría ${esc(d.nombre)} cada consulta: resumida, clasificada por nivel de interés y lista para contactar. Primero aparece su simulación; las marcadas como "Ejemplo" son consultas simuladas para mostrar filtros y estadísticas.`}</p>
        <div id="pmia"></div>
        <div id="pstats">${estadisticas()}</div>
        <div class="filters">
          <div class="fchips">${chip("", "Todas")}${chip("caliente", "Para contactar")}${chip("tibio", "Interesado")}${chip("frio", "Explorando")}</div>
          <div class="fsel">
            <select id="fo"><option value="">Operación: todas</option><option value="compra">Compra</option><option value="alquiler">Alquiler</option><option value="tasacion">Tasación</option></select>
            <select id="ff"><option value="">Fecha: todas</option><option value="hoy">Últimas 24 h</option><option value="7">Últimos 7 días</option><option value="30">Últimos 30 días</option></select>
            <select id="fe"><option value="">Estado: todos</option><option value="pendiente">Pendientes</option><option value="contactado">Contactadas</option></select>
            <input id="fq" type="search" placeholder="Buscar por nombre o búsqueda">
          </div>
        </div>
        <div id="plist"></div>`;
      $("#fo", panel).value = f.oper; $("#ff", panel).value = f.fecha; $("#fe", panel).value = f.estado; $("#fq", panel).value = f.q;
      panel.querySelectorAll("[data-n]").forEach((b) => b.onclick = () => { f.nivel = b.dataset.n; pintar(); });
      $("#fo", panel).onchange = (e) => { f.oper = e.target.value; pintarLista(); };
      $("#ff", panel).onchange = (e) => { f.fecha = e.target.value; pintarLista(); };
      $("#fe", panel).onchange = (e) => { f.estado = e.target.value; pintarLista(); };
      $("#fq", panel).oninput = (e) => { f.q = e.target.value; pintarLista(); };
      pintarLista();
    }

    let tab = "consultas";
    async function load() {
      panel.innerHTML = `<div class="ptop"><b>Panel</b><button id="pRef">Actualizar</button><button id="pClose">Volver</button></div>
        <div class="ptabs"><button type="button" data-t="consultas" class="${tab === "consultas" ? "on" : ""}">Consultas</button><button type="button" data-t="propiedades" class="${tab === "propiedades" ? "on" : ""}">Propiedades</button></div>
        <div class="pin"><div class="loading" style="min-height:40vh">Cargando…</div></div>`;
      $("#pClose").onclick = () => panel.classList.add("hide");
      $("#pRef").onclick = load;
      panel.querySelectorAll("[data-t]").forEach((b) => b.onclick = () => { tab = b.dataset.t; load(); });
      if (tab === "propiedades") return propiedades.load($(".pin", panel));
      try { rows = await rpc("get_demo_panel", { p_slug: d.slug, p_ids: [...SESION] }); } catch { $(".pin", panel).innerHTML = `<div class="empty">No se pudo cargar el panel. Intente nuevamente.</div>`; return; }
      pintar();
    }
    const propiedades = setupPropiedades(d);
    $("#openPanel").onclick = () => { tab = "consultas"; panel.classList.remove("hide"); load(); if (window.__panelVisto) window.__panelVisto(); };
  }
  // ---------- panel: propiedades ----------
  const ESTADOS = [["disponible", "Disponible"], ["reservada", "Reservada"], ["vendida", "Vendida"], ["alquilada", "Alquilada"], ["pausada", "Pausada"]];
  const ESTADO_TXT = Object.fromEntries(ESTADOS);
  const OPS = [["venta", "Venta"], ["alquiler", "Alquiler"], ["venta y alquiler", "Venta y alquiler"]];
  const CAMPOS = [
    ["codigo", "Código"], ["estado", "Estado"], ["operacion", "Operación"], ["tipo", "Tipo"], ["ubicacion", "Ubicación"], ["titulo", "Título"],
    ["precio_venta", "Precio venta"], ["precio_alquiler", "Precio alquiler"], ["ambientes", "Ambientes"], ["dormitorios", "Dormitorios"], ["banos", "Baños"],
    ["sup_cubierta", "Sup. cubierta (m²)"], ["sup_total", "Total construido (m²)"], ["terreno", "Terreno (m²)"], ["link", "Link al aviso"], ["foto", "Foto principal"],
  ];
  const sinTilde = (t) => String(t || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]/g, "");
  let xlsxP = null;
  const cargarXLSX = () => xlsxP || (xlsxP = new Promise((ok, mal) => {
    const sc = document.createElement("script");
    sc.src = "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";
    sc.onload = () => ok(window.XLSX); sc.onerror = () => { xlsxP = null; mal(new Error("xlsx")); };
    document.head.appendChild(sc);
  }));

  function setupPropiedades(d) {
    let box = null, props = [], log = [], ver = 40;
    const f = { q: "", estado: "", oper: "", tipo: "" };

    function filtrar() {
      const q = sinTilde(f.q);
      return props.filter((p) => {
        if (f.estado && p.estado !== f.estado) return false;
        if (f.oper && !p.operacion.includes(f.oper)) return false;
        if (f.tipo && p.tipo !== f.tipo) return false;
        if (q && !sinTilde(`${p.codigo} ${p.titulo} ${p.tipo} ${p.ubicacion}`).includes(q)) return false;
        return true;
      });
    }
    function fila(p) {
      const precio = [p.precio_venta, p.precio_alquiler].filter(Boolean).join(" · ") || "Precio a consultar";
      const meta = [p.ambientes ? p.ambientes + " amb." : "", p.sup_cubierta ? p.sup_cubierta + " m²" : p.terreno ? p.terreno + " m² de terreno" : ""].filter(Boolean).join(" · ");
      return `<div class="prow e-${esc(p.estado)}" data-id="${esc(p.id)}">
        ${safeUrl(p.foto) ? `<img src="${esc(p.foto)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'nofoto'}))">` : `<div class="nofoto"></div>`}
        <div class="pinfo"><b>${esc(p.tipo || "Propiedad")} · ${esc(p.ubicacion || "")}</b>
          <small>${esc(p.titulo)} · Cód. ${esc(p.codigo)}</small>
          <span class="pp">${esc(precio)}</span>${meta ? `<small>${esc(meta)}</small>` : ""}</div>
        <select class="pest" data-id="${esc(p.id)}" aria-label="Estado">${ESTADOS.map(([v, l]) => `<option value="${v}" ${p.estado === v ? "selected" : ""}>${l}</option>`).join("")}</select>
      </div>`;
    }
    function resumen() {
      const c = (e) => props.filter((p) => p.estado === e).length;
      return `<div class="stats">
        <div class="stat g"><b>${c("disponible")}</b><small>Disponibles (las ofrece el asistente)</small></div>
        <div class="stat"><b>${c("reservada")}</b><small>Reservadas</small></div>
        <div class="stat"><b>${c("vendida") + c("alquilada")}</b><small>Vendidas o alquiladas</small></div>
        <div class="stat"><b>${props.length}</b><small>Total cargadas</small></div></div>`;
    }
    function pintarLista() {
      const lista = filtrar();
      $("#prlist", box).innerHTML = `<div class="count">${lista.length} de ${props.length} propiedades</div>` +
        (lista.length ? lista.slice(0, ver).map(fila).join("") : `<div class="empty">No hay propiedades con estos filtros.</div>`) +
        (lista.length > ver ? `<button type="button" class="more" id="prMore">Mostrar más (${lista.length - ver} restantes)</button>` : "");
      const m = $("#prMore", box); if (m) m.onclick = () => { ver += 60; pintarLista(); };
      box.querySelectorAll(".pest").forEach((sel) => {
        sel.onclick = (e) => e.stopPropagation();
        sel.onchange = async () => {
          const p = props.find((x) => x.id === sel.dataset.id); if (!p) return;
          sel.disabled = true;
          try { Object.assign(p, await rpc("guardar_propiedad", { p_slug: d.slug, p_prop: { id: p.id, estado: sel.value } })); toast(`${p.tipo || "Propiedad"} ${p.codigo}: ${ESTADO_TXT[p.estado]}.${p.estado === "disponible" ? " El asistente vuelve a ofrecerla." : " El asistente deja de ofrecerla."}`); }
          catch { toast("No se pudo guardar. Intente nuevamente."); sel.value = p.estado; }
          sel.disabled = false;
          refrescarLog(); $("#prstats", box).innerHTML = resumen(); pintarLista();
        };
      });
      box.querySelectorAll(".prow").forEach((r) => r.onclick = () => editar(props.find((x) => x.id === r.dataset.id)));
    }
    async function refrescarLog() {
      try { const j = await rpc("get_propiedades", { p_slug: d.slug }); log = j.log || []; } catch {}
      const el = $("#prlog", box); if (el) el.innerHTML = pintarLog();
    }
    function pintarLog() {
      if (!log.length) return `<small style="color:var(--mute)">Todavía no hay cambios.</small>`;
      return log.slice(0, 15).map((l) => `<div class="lgrow"><time>${new Date(l.fecha).toLocaleString("es-AR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })}</time><span><b>${esc(l.cambio)}</b>${l.titulo ? " · " + esc(l.titulo) : ""}${l.codigo && l.codigo !== "-" ? " (" + esc(l.codigo) + ")" : ""}${l.detalle ? " · " + esc(l.detalle) : ""}</span></div>`).join("");
    }
    function pintar() {
      const tipos = [...new Set(props.map((p) => p.tipo).filter(Boolean))].sort();
      const chip = (v, l) => `<button type="button" data-e="${v}" class="${f.estado === v ? "on" : ""}">${l}</button>`;
      box.innerHTML = `
        <p class="pintro">Las propiedades que ve el asistente. Lo que se marque acá se aplica en el momento: una propiedad alquilada o vendida deja de ofrecerse. En el servicio real esta lista se actualiza sola dos veces por día desde su web o su sistema.</p>
        <div id="prstats">${resumen()}</div>
        <div class="pacts">
          <button type="button" class="pri" id="prNew">+ Nueva propiedad</button>
          <button type="button" id="prImp">Importar Excel</button>
          <button type="button" id="prExp">Exportar Excel</button>
          <input type="file" id="prFile" accept=".xlsx,.xls,.csv" class="hide">
        </div>
        <div class="filters">
          <div class="fchips">${chip("", "Todas")}${ESTADOS.map(([v, l]) => chip(v, l + "s")).join("")}</div>
          <div class="fsel">
            <select id="pfo"><option value="">Operación: todas</option><option value="venta">Venta</option><option value="alquiler">Alquiler</option></select>
            <select id="pft"><option value="">Tipo: todos</option>${tipos.map((t) => `<option>${esc(t)}</option>`).join("")}</select>
            <input id="pfq" type="search" placeholder="Buscar por código, barrio o título" style="grid-column:span 2">
          </div>
        </div>
        <div id="prlist"></div>
        <details class="plog"><summary>Últimos cambios</summary><div id="prlog">${pintarLog()}</div></details>`;
      $("#pfo", box).value = f.oper; $("#pft", box).value = f.tipo; $("#pfq", box).value = f.q;
      box.querySelectorAll("[data-e]").forEach((b) => b.onclick = () => { f.estado = b.dataset.e; ver = 40; pintar(); });
      $("#pfo", box).onchange = (e) => { f.oper = e.target.value; ver = 40; pintarLista(); };
      $("#pft", box).onchange = (e) => { f.tipo = e.target.value; ver = 40; pintarLista(); };
      $("#pfq", box).oninput = (e) => { f.q = e.target.value; ver = 40; pintarLista(); };
      $("#prNew", box).onclick = () => editar(null);
      $("#prExp", box).onclick = exportar;
      $("#prImp", box).onclick = () => $("#prFile", box).click();
      $("#prFile", box).onchange = (e) => { const fl = e.target.files[0]; e.target.value = ""; if (fl) importar(fl); };
      pintarLista();
    }

    // --- formulario (alta / edición) ---
    function editar(p) {
      const v = p || { estado: "disponible", operacion: "venta" };
      const inp = (k, l, type = "text", span = false) => `<label class="${span ? "full" : ""}"><span>${l}</span><input name="${k}" type="${type}" value="${esc(v[k] ?? "")}" ${type === "number" ? 'inputmode="decimal" step="any"' : ""}></label>`;
      const sel = (k, l, ops) => `<label><span>${l}</span><select name="${k}">${ops.map(([o, t]) => `<option value="${o}" ${v[k] === o ? "selected" : ""}>${t}</option>`).join("")}</select></label>`;
      const m = modal(`<h3>${p ? "Editar propiedad" : "Nueva propiedad"}</h3>
        <form class="pform">
          ${inp("titulo", "Título", "text", true)}
          ${sel("estado", "Estado", ESTADOS)}${sel("operacion", "Operación", OPS)}
          ${inp("tipo", "Tipo (Casa, Departamento…)")}${inp("ubicacion", "Ubicación")}
          ${inp("precio_venta", "Precio venta (ej. USD 145.000)")}${inp("precio_alquiler", "Precio alquiler (ej. $1.200.000)")}
          ${inp("ambientes", "Ambientes", "number")}${inp("dormitorios", "Dormitorios", "number")}
          ${inp("banos", "Baños", "number")}${inp("sup_cubierta", "Sup. cubierta (m²)", "number")}
          ${inp("sup_total", "Total construido (m²)", "number")}${inp("terreno", "Terreno (m²)", "number")}
          ${inp("codigo", "Código")}${inp("link", "Link al aviso", "url")}
          ${inp("foto", "Link de la foto principal", "url", true)}
          <div class="mrow full"><button type="button" data-x>Cancelar</button><button type="submit" class="pri">Guardar</button></div>
        </form>`);
      $("form", m).onsubmit = async (e) => {
        e.preventDefault();
        const datos = Object.fromEntries(new FormData(e.target).entries());
        if (!datos.titulo.trim()) { toast("Falta el título."); return; }
        if (p) datos.id = p.id;
        const b = $("[type=submit]", m); b.disabled = true; b.textContent = "Guardando…";
        try {
          const r = await rpc("guardar_propiedad", { p_slug: d.slug, p_prop: datos });
          const i = props.findIndex((x) => x.id === r.id);
          if (i >= 0) props[i] = r; else props.unshift(r);
          cerrarModal(); toast(p ? "Cambios guardados." : "Propiedad agregada. El asistente ya puede ofrecerla.");
          refrescarLog(); $("#prstats", box).innerHTML = resumen(); pintarLista();
        } catch { b.disabled = false; b.textContent = "Guardar"; toast("No se pudo guardar. Revise los datos e intente nuevamente."); }
      };
    }

    // --- Excel ---
    const filaExcel = (p) => CAMPOS.map(([k]) => k === "estado" ? ESTADO_TXT[p.estado] || p.estado : k === "operacion" ? (OPS.find((o) => o[0] === p.operacion) || [0, p.operacion])[1] : p[k] ?? "");
    async function exportar() {
      try {
        const X = await cargarXLSX();
        const ws = X.utils.aoa_to_sheet([CAMPOS.map((c) => c[1]), ...props.map(filaExcel)]);
        ws["!cols"] = CAMPOS.map(([k]) => ({ wch: ["titulo", "ubicacion", "link", "foto"].includes(k) ? 34 : 14 }));
        const wb = X.utils.book_new(); X.utils.book_append_sheet(wb, ws, "Propiedades");
        X.writeFile(wb, `propiedades-${d.slug}.xlsx`);
      } catch { toast("No se pudo generar el Excel."); }
    }
    async function importar(file) {
      let filas;
      try {
        const X = await cargarXLSX();
        const wb = X.read(await file.arrayBuffer());
        filas = X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "", raw: false });
      } catch { toast("No se pudo leer el archivo. Use .xlsx o .csv."); return; }
      const mapa = Object.fromEntries(CAMPOS.map(([k, l]) => [sinTilde(l), k]));
      Object.assign(mapa, { codigo: "codigo", ref: "codigo", referencia: "codigo", precio: "precio_venta", supcubierta: "sup_cubierta", superficiecubierta: "sup_cubierta", totalconstruido: "sup_total", terreno: "terreno", link: "link", foto: "foto", banos: "banos" });
      const opDe = (t) => { const x = sinTilde(t); return x.includes("venta") && x.includes("alquiler") ? "venta y alquiler" : x.includes("alquiler") ? "alquiler" : x ? "venta" : ""; };
      const rows = filas.map((fl) => {
        const o = {};
        for (const [col, val] of Object.entries(fl)) { const k = mapa[sinTilde(col)] || mapa[sinTilde(col).replace(/m2$/, "")]; if (k && String(val).trim() !== "") o[k] = String(val).trim(); }
        if (o.operacion) o.operacion = opDe(o.operacion);
        if (o.estado) o.estado = sinTilde(o.estado).replace(/s$/, "");
        return o;
      }).filter((o) => o.codigo || o.titulo);
      if (!rows.length) { toast("No se encontraron filas. Exporte la lista actual para ver las columnas que se usan."); return; }
      const cods = new Set(props.map((p) => p.codigo));
      const act = rows.filter((r) => r.codigo && cods.has(r.codigo)).length;
      const baja = rows.filter((r) => ["vendida", "alquilada", "pausada"].includes(r.estado)).length;
      const m = modal(`<h3>Importar ${esc(file.name)}</h3>
        <div class="ires"><div><b>${rows.length}</b><small>filas leídas</small></div><div><b>${rows.length - act}</b><small>nuevas</small></div><div><b>${act}</b><small>se actualizan (mismo código)</small></div><div><b>${baja}</b><small>pasan a vendida, alquilada o pausada</small></div></div>
        <p class="pintro">Las propiedades con el mismo código se actualizan; no se duplican. Las que no estén en el archivo quedan como están.</p>
        <div class="mrow"><button type="button" data-x>Cancelar</button><button type="button" class="pri" id="impOk">Importar</button></div>`);
      $("#impOk", m).onclick = async () => {
        const b = $("#impOk", m); b.disabled = true; b.textContent = "Importando…";
        try {
          let n = 0, u = 0;
          for (let i = 0; i < rows.length; i += 300) { const r = await rpc("importar_propiedades", { p_slug: d.slug, p_rows: rows.slice(i, i + 300) }); n += r.nuevas; u += r.actualizadas; }
          cerrarModal(); toast(`Importación lista: ${n} nuevas y ${u} actualizadas.`); load(box);
        } catch { b.disabled = false; b.textContent = "Importar"; toast("No se pudo importar. Revise el archivo e intente nuevamente."); }
      };
    }

    // --- modal y avisos ---
    function modal(html) {
      cerrarModal();
      const m = document.createElement("div");
      m.className = "pmodal"; m.innerHTML = `<div class="pmbox">${html}</div>`;
      m.onclick = (e) => { if (e.target === m || e.target.hasAttribute("data-x")) cerrarModal(); };
      document.body.appendChild(m);
      return m;
    }
    function cerrarModal() { document.querySelectorAll(".pmodal").forEach((x) => x.remove()); }
    function toast(t) {
      const el = Object.assign(document.createElement("div"), { className: "ptoast", textContent: t });
      document.body.appendChild(el); setTimeout(() => el.remove(), 3800);
    }

    async function load(el) {
      box = el; ver = 40;
      try { const j = await rpc("get_propiedades", { p_slug: d.slug }); props = j.props || []; log = j.log || []; }
      catch { box.innerHTML = `<div class="empty">No se pudieron cargar las propiedades. Intente nuevamente.</div>`; return; }
      if (!props.length) {
        box.innerHTML = `<p class="pintro">Esta demo todavía no tiene propiedades administradas. Puede agregarlas a mano o importar un Excel.</p><div class="pacts"><button type="button" class="pri" id="prNew">+ Nueva propiedad</button><button type="button" id="prImp">Importar Excel</button><input type="file" id="prFile" accept=".xlsx,.xls,.csv" class="hide"></div>`;
        $("#prNew", box).onclick = () => editar(null); 
        $("#prImp", box).onclick = () => $("#prFile", box).click();
        $("#prFile", box).onchange = (e) => { const fl = e.target.files[0]; e.target.value = ""; if (fl) importar(fl); };
        return;
      }
      pintar();
    }
    return { load };
  }
})();
</script>
</body>
</html>
