<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Una Pizza · QR para imprimir</title><meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍕</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#eee3d6;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#2a1a12}
button,input{font:inherit}
.bar{position:sticky;top:0;background:#1a1310;color:#fbf1e6;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:2}
.bar p{flex:1;min-width:220px;font-size:13.5px;opacity:.85}
.bar button{border:0;background:#e8462e;color:#fff;font-weight:800;border-radius:10px;padding:10px 16px;cursor:pointer}
.bar button.sec{background:#30231c;border:1px solid #3d2d24}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;padding:16px;max-width:1100px;margin:0 auto}
.card{background:#fffaf3;border:2px dashed #c9b39c;border-radius:18px;padding:18px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;page-break-inside:avoid;break-inside:avoid}
.top{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:900;color:#c8341f}
.lg{width:36px;height:36px;border-radius:50%;background:#c8341f;display:grid;place-items:center;font-size:20px}
.mesa{font-size:22px;font-weight:700}.mesa span{font-size:40px;font-weight:900;color:#c8341f;line-height:1}
.dl .mesa span{font-size:30px}
.qr{width:190px;height:190px;padding:8px;background:#fff;border-radius:12px;border:3px solid #2a1a12}
.qr svg{width:100%;height:100%;display:block}
.cta{font-weight:800;font-size:16px;line-height:1.2}
ul{list-style:none;font-size:13px;color:#6b5646;display:flex;flex-direction:column;gap:2px}
.login{max-width:340px;margin:14vh auto;text-align:center;padding:20px}
.login input{width:100%;margin:16px 0 10px;padding:14px;border-radius:12px;border:1px solid #c9b39c;font-size:24px;text-align:center;letter-spacing:.3em}
.login button{width:100%;border:0;border-radius:12px;padding:14px;font-weight:800;background:#c8341f;color:#fff;cursor:pointer}
.err{color:#c8341f;min-height:22px}
.hide{display:none!important}
@media print{body{background:#fff}.bar{display:none}.sheet{grid-template-columns:repeat(2,1fr);gap:10mm;padding:0;max-width:none}.card{border-color:#999}@page{size:A4;margin:12mm}}
</style></head><body>
<section id="vLogin" class="login"><div style="font-size:50px">🖨️</div><h2>QR de las mesas</h2><p style="color:#6b5646;margin-top:4px">Ingresá el PIN del panel</p>
  <input id="pin" inputmode="numeric" maxlength="6" placeholder="PIN" autocomplete="off"><div class="err" id="err"></div><button id="entrar">Ver los QR</button></section>
<div id="vApp" class="hide">
<div class="bar"><p><b>QR de Una Pizza</b> · uno por mesa + uno para delivery. Entran 4 por hoja A4: imprimí, recortá por la línea punteada y ponelos en cada mesa. Cada QR de mesa tiene un código secreto; si alguien lo usa mal, tocá "Cambiar códigos" y volvé a imprimir.</p>
  <button class="sec" id="rotar">🔄 Cambiar códigos</button><button onclick="print()">🖨️ Imprimir</button></div>
<div class="sheet" id="sheet"></div>
</div>
<script src="qrcode.js"></script>
<script>
const API = "https://itnxcvnmmoqgeijerjqj.supabase.co/functions/v1/resto-wa?n=unapizza&panel=1";
const BASE = "https://kiondaia.com/unapizza/menu/";
let PIN = "", confirmar = false;
const el = id => document.getElementById(id);
const store = { get(k) { try { return localStorage.getItem(k) } catch { return null } }, set(k, v) { try { localStorage.setItem(k, v) } catch {} } };
async function api(accion, extra = {}) {
  const r = await fetch(API, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ pin: PIN, accion, ...extra }) });
  const j = await r.json().catch(() => ({ error: "Sin conexión" }));
  if (j.error) throw new Error(j.error);
  return j;
}
function svg(url) {
  const q = qrcode(0, "M"); q.addData(url); q.make();
  const n = q.getModuleCount(); let d = "";
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (q.isDark(y, x)) d += `M${x + 1},${y + 1}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n + 2} ${n + 2}" shape-rendering="crispEdges"><path d="${d}" fill="#2a1a12"/></svg>`;
}
async function cargar() {
  const d = await api("datos"), t = d.config.mesa_tokens || {}, n = d.config.mesas || 0;
  let h = "";
  for (let m = 1; m <= n; m++) if (t[m]) h += `<div class="card"><div class="top"><span class="lg">🍕</span><b>Una Pizza</b></div>
    <div class="mesa">Mesa <span>${m}</span></div><div class="qr" data-url="${BASE}?m=${t[m]}">${svg(BASE + "?m=" + t[m])}</div>
    <div class="cta">Escaneá y pedí desde la mesa</div><ul><li>📋 Mirá la carta</li><li>👨‍🍳 Pedí directo a la cocina</li><li>🙋 Llamá al mozo · 🧾 Pedí la cuenta</li></ul></div>`;
  h += `<div class="card dl"><div class="top"><span class="lg">🍕</span><b>Una Pizza</b></div><div class="mesa">Pedí <span>delivery</span></div>
    <div class="qr" data-url="${BASE}">${svg(BASE)}</div><div class="cta">Escaneá, armá tu pedido y mandalo por WhatsApp</div>
    <ul><li>🛵 Delivery o 🏃 para retirar</li><li>💬 Te confirmamos al toque</li><li>Mendoza 1578 · Paseo Mendoza</li></ul></div>`;
  el("sheet").innerHTML = h;
}
async function entrar(pin) {
  PIN = pin; el("err").textContent = "";
  try { await cargar(); store.set("unapizza_pin", pin); el("vLogin").classList.add("hide"); el("vApp").classList.remove("hide"); }
  catch (e) { el("err").textContent = e.message; }
}
el("entrar").onclick = () => entrar(el("pin").value.trim());
el("pin").onkeydown = e => { if (e.key === "Enter") el("entrar").click(); };
el("rotar").onclick = async () => {
  const b = el("rotar");
  if (!confirmar) { confirmar = true; b.textContent = "⚠️ Los QR impresos dejan de andar. ¿Seguro?"; setTimeout(() => { confirmar = false; b.textContent = "🔄 Cambiar códigos"; }, 5000); return; }
  confirmar = false; b.textContent = "…";
  try { await api("rotar_mesas"); await cargar(); b.textContent = "✅ Códigos nuevos: imprimí de nuevo"; } catch (e) { b.textContent = "Error: " + e.message; }
};
const g = store.get("unapizza_pin"); if (g) entrar(g);
</script>
</body></html>
